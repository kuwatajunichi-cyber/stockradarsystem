name: Reusable Quality Gate

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.11"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy
        run: mypy src/stockradar/jobs src/stockradar/indicators
      - name: Unit
        run: pytest --strict-markers -m "unit" -v
      - name: Job integration
        run: pytest --strict-markers -m "job_integration" -v
      - name: Smoke
        run: pytest --strict-markers -m "smoke" -v
      - name: Actionlint
        uses: raven-actions/actionlint@v2
