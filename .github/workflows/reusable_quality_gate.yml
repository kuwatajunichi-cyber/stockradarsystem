name: Reusable Quality Gate

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.11"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy
        run: mypy src/stockradar/jobs src/stockradar/indicators
      - name: Unit
        run: pytest --strict-markers -m "unit" -v
      - name: Job integration
        run: pytest --strict-markers -m "job_integration" -v
      - name: Smoke
        run: pytest --strict-markers -m "smoke" -v
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Worker cron dispatcher tests
        run: npm test --prefix workers/github-cron-dispatcher
      - name: Actionlint
        env:
          # SC2129: multiple writes to $GITHUB_OUTPUT are standard in GHA; actionlint docs recommend excluding it.
          SHELLCHECK_OPTS: --exclude=SC2129
        run: |
          set -euo pipefail
          # raven-actions/actionlint は codeload 取得失敗や @actions/tool-cache 破壊で不安定なため、公式バイナルを利用
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash | bash -s -- "1.7.12"
          ./actionlint -color
