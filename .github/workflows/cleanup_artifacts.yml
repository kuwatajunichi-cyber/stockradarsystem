name: Cleanup GitHub Artifacts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (true/false)"
        required: true
        default: "true"
      config_path:
        description: "Path to cleanup config YAML"
        required: true
        default: "config/cleanup_artifacts.yaml"
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: cleanup-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run artifact cleanup script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
          # schedule: default real delete; manual dispatch defaults to dry-run true
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (github.event.inputs.dry_run || 'true') }}
          CONFIG_PATH: ${{ github.event.inputs.config_path || 'config/cleanup_artifacts.yaml' }}
        run: |
          set -euo pipefail
          ARGS=(python scripts/cleanup_artifacts.py --repo "${{ github.repository }}" --config "$CONFIG_PATH")
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          "${ARGS[@]}"

      - name: Summary
        if: always()
        run: |
          echo "## cleanup_artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- config: \`${{ github.event.inputs.config_path || 'config/cleanup_artifacts.yaml' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- dry_run: \`${{ github.event_name == 'schedule' && 'false' || (github.event.inputs.dry_run || 'true') }}\`" >> "$GITHUB_STEP_SUMMARY"
