# 単体テスト（Secrets 不要）
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (jobs 限定)
        run: ruff check src/stockradar/jobs/ --select F401,F841

      - name: Mypy (緩和設定・段階導入)
        run: mypy src/stockradar/jobs/ --ignore-missing-imports --allow-untyped-defs --no-strict-optional || true

      - name: Run tests
        run: pytest tests/ -v
