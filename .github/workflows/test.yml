# 単体テスト（Secrets 不要）
# pull_request bases: main and phase45/** (stack PRs)
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - "phase45/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy src/stockradar/jobs src/stockradar/indicators

      - name: Unit tests
        run: pytest --strict-markers -m "unit" -v

  job_integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Job integration tests
        run: pytest --strict-markers -m "job_integration" -v

  smoke:
    runs-on: ubuntu-latest
    needs: job_integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Smoke tests
        run: pytest --strict-markers -m "smoke" -v

  worker:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Worker unit tests
        run: npm test --prefix workers/github-cron-dispatcher
