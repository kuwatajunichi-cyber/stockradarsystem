# 日次レポート スプレッドシート生成ワークフロー
# - 単独実行: workflow_dispatch で手動テスト
# - 本番: workflow_call で daily 等から呼び出し
#
# 必要 Secrets: GCP_SA_JSON（サービスアカウント JSON）
name: Render Sheet (Daily Report)

on:
  workflow_dispatch:
    inputs:
      csv_drive_file_id:
        description: "CSV の Drive ファイル ID または共有リンク（必須）"
        required: true
        type: string
      template_spreadsheet_id:
        description: "テンプレのスプレッドシート ID（省略時は config で検索）"
        required: false
        type: string
      output_folder_id:
        description: "出力先フォルダ ID（省略時は config を使用）"
        required: false
        type: string
      header_anchor_sheet_name:
        description: "headerAnchor が存在するシート名（省略時は config を使用）"
        required: false
        type: string
        default: "indicators001"
  workflow_call:
    inputs:
      csv_drive_file_id:
        description: "CSV の Drive ファイル ID または共有リンク（必須）"
        required: true
        type: string
      template_spreadsheet_id:
        description: "テンプレのスプレッドシート ID"
        required: false
        type: string
      output_folder_id:
        description: "出力先フォルダ ID"
        required: false
        type: string
      header_anchor_sheet_name:
        description: "headerAnchor が存在するシート名"
        required: false
        type: string
        default: "indicators001"
    outputs:
      spreadsheet_url:
        description: "生成したスプレッドシートの URL"
        value: ${{ jobs.render.outputs.spreadsheet_url }}

env:
  TZ: Asia/Tokyo

jobs:
  render:
    runs-on: ubuntu-latest
    outputs:
      spreadsheet_url: ${{ steps.run.outputs.spreadsheet_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render sheet (Drive CSV → Sheets)
        id: run
        env:
          PYTHONPATH: .
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -e
          ARGS=(
            --csv-drive-file-id "${{ inputs.csv_drive_file_id }}"
          )
          [ -n "${{ inputs.template_spreadsheet_id }}" ] && ARGS+=(--template-spreadsheet-id "${{ inputs.template_spreadsheet_id }}")
          [ -n "${{ inputs.output_folder_id }}" ] && ARGS+=(--output-folder-id "${{ inputs.output_folder_id }}")
          [ -n "${{ inputs.header_anchor_sheet_name }}" ] && ARGS+=(--header-anchor-sheet-name "${{ inputs.header_anchor_sheet_name }}")
          
          OUTPUT=$(python scripts/render_sheet/render_sheet.py "${ARGS[@]}" 2>&1 | tee render_log.txt)
          SPREADSHEET_URL=$(echo "$OUTPUT" | grep "^spreadsheet_url=" | cut -d= -f2-)
          [ -n "$SPREADSHEET_URL" ] && echo "spreadsheet_url=$SPREADSHEET_URL" >> "$GITHUB_OUTPUT"
          
          echo "::group::レンダリングログ"
          cat render_log.txt
          echo "::endgroup::"
