name: Derived Orphan Sweep

# Safe derived_object_index / R2 cleanup after failed derived writes.
# Prefix-delete R2 only for orphan-only generations. Mixed gens: per-key + DB.
# Physical DELETE of orphan rows requires migration 020 (delete_orphan_rows=true).
# Weekly supabase_orphan_sweep.yml does not cover derived_object_index.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = log only, no R2/Supabase deletes"
        type: boolean
        default: true
      delete_orphan_rows:
        description: "true = DELETE status=orphan rows via delete_orphan_derived_objects (needs migration 020)"
        type: boolean
        default: false

concurrency:
  group: derived-orphan-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sweep derived orphans
        env:
          PYTHONPATH: src:.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          ARGS=(--json-summary /tmp/derived_orphan_sweep.json)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${{ inputs.delete_orphan_rows }}" = "true" ]; then
            ARGS+=(--delete-orphan-rows)
          fi
          python scripts/storage/derived_generation_sweeper.py "${ARGS[@]}"
          if [ -f /tmp/derived_orphan_sweep.json ]; then
            {
              echo "## derived orphan sweep"
              echo '```json'
              cat /tmp/derived_orphan_sweep.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
