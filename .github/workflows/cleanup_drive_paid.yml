# Google Drive 0012_paid の 3 か月保持クリーンアップ。Drive 凍結解除後に有効化する。
name: Cleanup Drive 0012_paid (3-month retention)

on:
  schedule:
    - cron: "5 3 1 * *"  # 毎月1日 03:05 UTC（work 側より少し後）
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Drive paid cleanup
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/gdrive/cleanup_paid.py --today "$(date -u +%Y-%m-%d)"

