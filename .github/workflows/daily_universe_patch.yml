name: Daily Universe Patch

on:
  workflow_dispatch:
  schedule:
    # 毎日 12:00 JST（03:00 UTC）
    - cron: "0 3 * * *"

concurrency:
  group: daily-universe-patch
  cancel-in-progress: false

env:
  PHASE3_ROLLOUT_STAGE: "3c"

jobs:
  resolve_trading_day:
    runs-on: ubuntu-latest
    outputs:
      run_date: ${{ steps.resolve.outputs.run_date }}
      is_open: ${{ steps.resolve.outputs.is_open }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve trading day
        id: resolve
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          OUTPUT=$(python -m stockradar.jobs.resolve_trading_day)
          RUN_DATE=$(echo "$OUTPUT" | grep "^run_date=" | cut -d= -f2)
          IS_OPEN=$(echo "$OUTPUT" | grep "^is_open=" | cut -d= -f2)
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "is_open=$IS_OPEN" >> "$GITHUB_OUTPUT"
          echo "Resolved: run_date=$RUN_DATE, is_open=$IS_OPEN"

      - name: Upsert Supabase runs row
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ steps.resolve.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python scripts/storage/control_plane_cli.py upsert-run \
            --workflow daily_universe_patch.yml \
            --github-run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --status running

  patch_universe:
    needs: resolve_trading_day
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve monthly tag for run_date
        id: monthly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName --template '{{range .}}{{.tagName}}{{"\n"}}{{end}}' > /tmp/gh_all_tags.txt
          grep '^monthly-' /tmp/gh_all_tags.txt > /tmp/monthly_tags.txt || true
          if [ ! -s /tmp/monthly_tags.txt ]; then
            echo "error: no monthly-* release tags"
            exit 1
          fi
          RESOLVE_OUT=$(python -m stockradar.jobs.resolve_monthly_release_for_run_date \
            --run-date "$RUN_DATE" \
            --tags-file /tmp/monthly_tags.txt)
          echo "$RESOLVE_OUT"
          MONTHLY_TAG=$(echo "$RESOLVE_OUT" | grep '^monthly_tag=' | cut -d= -f2-)
          UV_RES=$(echo "$RESOLVE_OUT" | grep '^universe_resolution=' | cut -d= -f2-)
          REASON=$(echo "$RESOLVE_OUT" | sed -n 's/^resolution_reason=//p')
          mkdir -p .tmp
          printf '%s' "$REASON" > .tmp/resolution_reason.txt
          echo "monthly_tag=$MONTHLY_TAG" >> "$GITHUB_OUTPUT"
          echo "universe_resolution=$UV_RES" >> "$GITHUB_OUTPUT"
          mkdir -p data/universe/jpx/latest_release
          if ! gh release download "$MONTHLY_TAG" \
            --pattern "equity_domestic_core_with_name.csv" \
            --dir "data/universe/jpx/latest_release" \
            --repo "${{ github.repository }}"; then
            echo "error: gh release download failed: $MONTHLY_TAG"
            exit 1
          fi

      - name: Patch universe (delisted removal)
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          RUN_DATE="${{ needs.resolve_trading_day.outputs.run_date }}"
          MONTHLY_TAG="${{ steps.monthly.outputs.monthly_tag }}"
          UV_RES="${{ steps.monthly.outputs.universe_resolution }}"
          REASON="$(cat .tmp/resolution_reason.txt)"
          python -m stockradar.jobs.patch_universe_daily \
            --input data/universe/jpx/latest_release/equity_domestic_core_with_name.csv \
            --run-date "$RUN_DATE" \
            --base-release "$MONTHLY_TAG" \
            --chosen-monthly-tag "$MONTHLY_TAG" \
            --universe-resolution "$UV_RES" \
            --resolution-reason "$REASON"

      - name: Put patched universe cache (R2 + Supabase)
        if: success()
        env:
          PYTHONPATH: src:.
          GITHUB_RUN_ID: ${{ github.run_id }}
          PHASE3_ROLLOUT_STAGE: ${{ env.PHASE3_ROLLOUT_STAGE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          MONTHLY_TAG="${{ steps.monthly.outputs.monthly_tag }}"
          RUN_DATE="${{ needs.resolve_trading_day.outputs.run_date }}"
          KEY="universe-patched-${MONTHLY_TAG}-${RUN_DATE}"
          python scripts/storage/cache_bus_cli.py put-patched \
            --cache-key "$KEY" \
            --monthly-tag "$MONTHLY_TAG" \
            --run-date "$RUN_DATE" \
            --csv-path data/universe/jpx/patched_cache/equity_domestic_core_with_name.csv \
            --manifest-path data/universe/jpx/patched_cache/manifest.json \
            --github-run-id "$GITHUB_RUN_ID" \
            --source-ref "${{ github.ref }}" \
            --json-output /tmp/patch_put_patched.json
