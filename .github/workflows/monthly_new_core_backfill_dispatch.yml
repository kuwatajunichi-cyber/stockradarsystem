name: Monthly New-Core Backfill Dispatch

on:
  workflow_dispatch:

concurrency:
  group: mnc-dispatch-poller
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  claim_and_dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Claim outbox and dispatch worker
        env:
          PYTHONPATH: src:.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_DISPATCH_TOKEN:-}" ]; then
            echo "GH_DISPATCH_TOKEN required" >&2
            exit 1
          fi
          python scripts/storage/mnc_dispatch_cli.py claim-and-dispatch \
            --limit 1 \
            --worker-workflow monthly_new_core_backfill.yml
