name: Monthly Universe Build

on:
  workflow_dispatch:  # 手動実行
  schedule:
    - cron: "0 2 1 * *"  # 毎月1日 02:00 UTC（日本時間 11:00）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git commit 取得のため

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache JPX URL cache
        uses: actions/cache@v4
        with:
          path: data/cache/jpx_latest_url.txt
          key: jpx-url-cache-${{ github.run_id }}
          restore-keys: |
            jpx-url-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monthly build
        env:
          PYTHONPATH: src
          LIQ_MIN_MEDIAN_TURNOVER_YEN: ${{ secrets.LIQ_MIN_MEDIAN_TURNOVER_YEN || '20000000' }}
        run: |
          echo "PYTHONPATH=$PYTHONPATH"
          echo "Current directory: $(pwd)"
          echo "Checking Python path:"
          python -c "import sys; print('\\n'.join(sys.path))"
          echo "Checking module:"
          python -c "import stockradar.utils.manifest; print('OK')" || echo "Import failed"
          python scripts/run_monthly.py

      - name: Get run ID from output
        id: get_run_id
        if: success()
        run: |
          RUN_ID=$(cat data/output/latest/LATEST_RUN_ID.txt 2>/dev/null || echo "")
          if [ -z "$RUN_ID" ]; then
            # fallback: 最新のstagingディレクトリから取得
            RUN_ID=$(ls -td data/output/staging/*/ 2>/dev/null | head -1 | xargs basename || echo "")
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Found RUN_ID: $RUN_ID"
          
          # ファイルの存在確認
          STAGING_DIR="data/output/staging/$RUN_ID"
          if [ -d "$STAGING_DIR" ]; then
            echo "Staging directory exists: $STAGING_DIR"
            ls -la "$STAGING_DIR" || true
          else
            echo "Warning: Staging directory not found: $STAGING_DIR"
          fi

      - name: Create Release
        if: success() && steps.get_run_id.outputs.run_id != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: monthly-${{ github.run_id }}
          name: Monthly Universe Build - ${{ steps.get_run_id.outputs.run_id }}
          body: |
            Monthly universe build completed successfully.
            
            Run ID: ${{ steps.get_run_id.outputs.run_id }}
            Workflow Run: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            
            ## Output Files
            - equity_domestic_ipo_with_name.csv
            - equity_domestic_illiquid_with_name.csv
            - equity_domestic_core_with_name.csv
          files: |
            data/output/staging/${{ steps.get_run_id.outputs.run_id }}/equity_domestic_ipo_with_name.csv
            data/output/staging/${{ steps.get_run_id.outputs.run_id }}/equity_domestic_illiquid_with_name.csv
            data/output/staging/${{ steps.get_run_id.outputs.run_id }}/equity_domestic_core_with_name.csv
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (for debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe-outputs-${{ github.run_id }}
          path: |
            data/output/staging/*/*.manifest.json
            data/output/latest/LATEST_RUN_ID.txt
            logs/*/run.log
          retention-days: 90
          if-no-files-found: warn

      - name: Upload logs (debug)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug-logs-${{ github.run_id }}
          path: |
            logs/**/*
            data/output/**/*
          retention-days: 7
          if-no-files-found: warn
