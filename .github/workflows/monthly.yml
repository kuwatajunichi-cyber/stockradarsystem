name: Monthly Universe Build

on:
  workflow_dispatch:  # 手動実行
  schedule:
    - cron: "0 2 1 * *"  # 毎月1日 02:00 UTC（日本時間 11:00）

jobs:
  preflight:
    uses: ./.github/workflows/reusable_quality_gate.yml

  build:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Release作成に必要
    env:
      PHASE4_ROLLOUT_STAGE: "4b"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git commit 取得のため

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache JPX URL cache
        uses: actions/cache@v4
        with:
          path: data/cache/jpx_latest_url.txt
          key: jpx-url-${{ github.run_number }}
          restore-keys: |
            jpx-url-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upsert Supabase runs row
        env:
          PYTHONPATH: src:.
          GITHUB_RUN_ID: ${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Tokyo date +%Y-%m-01)"
          python scripts/storage/control_plane_cli.py upsert-run \
            --workflow monthly.yml \
            --github-run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --status running

      - name: Run monthly build
        env:
          PYTHONPATH: src
          LIQ_MIN_MEDIAN_TURNOVER_YEN: ${{ secrets.LIQ_MIN_MEDIAN_TURNOVER_YEN || '20000000' }}
        run: |
          echo "PYTHONPATH=$PYTHONPATH"
          echo "Current directory: $(pwd)"
          echo "Checking Python path:"
          python -c "import sys; print('\\n'.join(sys.path))"
          echo "Checking module:"
          python -c "import stockradar.utils.manifest; print('OK')" || echo "Import failed"
          python scripts/run_monthly.py

      - name: Get run ID from output
        id: get_run_id
        if: success()
        run: |
          set -euo pipefail
          RUN_ID="$(cat data/output/latest/LATEST_RUN_ID.txt 2>/dev/null || echo "")"
          if [ -z "$RUN_ID" ]; then
            # fallback: 最新のstagingディレクトリから取得
            RUN_ID="$(find data/output/staging -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort -r | head -1 || echo "")"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Found RUN_ID: $RUN_ID"
          
          # ファイルの存在確認
          STAGING_DIR="data/output/staging/$RUN_ID"
          if [ -d "$STAGING_DIR" ]; then
            echo "Staging directory exists: $STAGING_DIR"
            ls -la "$STAGING_DIR" || true
          else
            echo "Warning: Staging directory not found: $STAGING_DIR"
          fi

      - name: Resolve build date and monthly tag
        id: build_meta
        if: success() && steps.get_run_id.outputs.run_id != ''
        run: |
          set -euo pipefail
          {
            echo "date=$(TZ=Asia/Tokyo date +%Y%m%d)"
            echo "snapshot_date=$(TZ=Asia/Tokyo date +%Y-%m-01)"
            echo "monthly_tag=monthly-$(TZ=Asia/Tokyo date +%Y%m%d)-${{ github.run_id }}"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: success() && steps.get_run_id.outputs.run_id != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: monthly-${{ steps.build_meta.outputs.date }}-${{ github.run_id }}
          name: Monthly Universe Build - ${{ steps.get_run_id.outputs.run_id }}
          body: |
            Monthly universe build completed successfully.
            
            Run ID: ${{ steps.get_run_id.outputs.run_id }}
            Workflow Run: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            
            ## Output Files
            - equity_domestic_ipo_with_name.csv
            - equity_domestic_illiquid_with_name.csv
            - equity_domestic_core_with_name.csv
          files: |
            data/output/staging/${{ steps.get_run_id.outputs.run_id }}/equity_domestic_ipo_with_name.csv
            data/output/staging/${{ steps.get_run_id.outputs.run_id }}/equity_domestic_illiquid_with_name.csv
            data/output/staging/${{ steps.get_run_id.outputs.run_id }}/equity_domestic_core_with_name.csv
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit monthly snapshot (R2 + Supabase)
        if: success() && steps.get_run_id.outputs.run_id != ''
        env:
          PYTHONPATH: src:.
          GITHUB_RUN_ID: ${{ github.run_id }}
          PHASE4_ROLLOUT_STAGE: ${{ env.PHASE4_ROLLOUT_STAGE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          STAGING="data/output/staging/${{ steps.get_run_id.outputs.run_id }}"
          python scripts/storage/monthly_bus_cli.py commit-snapshot \
            --staging-dir "$STAGING" \
            --monthly-tag "${{ steps.build_meta.outputs.monthly_tag }}" \
            --snapshot-date "${{ steps.build_meta.outputs.snapshot_date }}" \
            --github-run-id "$GITHUB_RUN_ID" \
            --phase4-rollout-stage "$PHASE4_ROLLOUT_STAGE" \
            --json-output /tmp/monthly_snapshot_commit.json

      - name: Install deps for multi-target upload
        if: success() && steps.get_run_id.outputs.run_id != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3

      - name: Upload latest 3 CSVs to all targets (work)
        if: success() && steps.get_run_id.outputs.run_id != ''
        env:
          PYTHONPATH: .
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_BASE_FOLDER: ${{ secrets.DROPBOX_BASE_FOLDER }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          RUN_ID="${{ steps.get_run_id.outputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            echo "エラー: RUN_ID が取得できませんでした"
            exit 1
          fi
          # 月次成果物は work (0011_work) 扱いなので、run-date はその月の1日とする
          RUN_DATE="$(TZ=Asia/Tokyo date +%Y-%m-01)"
          STAGING="data/output/staging/$RUN_ID"
          IPO="$STAGING/equity_domestic_ipo_with_name.csv"
          ILLIQ="$STAGING/equity_domestic_illiquid_with_name.csv"
          CORE="$STAGING/equity_domestic_core_with_name.csv"
          for f in "$IPO" "$ILLIQ" "$CORE"; do
            if [ ! -f "$f" ]; then
              echo "エラー: 月次成果物が見つかりません: $f"
              exit 1
            fi
          done
          TARGETS="r2,dropbox,github"
          if [ -n "$GDRIVE_OAUTH_CLIENT_ID" ] && [ -n "$GDRIVE_OAUTH_REFRESH_TOKEN" ]; then
            TARGETS="drive,r2,dropbox,github"
          fi
          python scripts/upload_to_all_targets.py --run-date "$RUN_DATE" --targets "$TARGETS" --files "$IPO" "$ILLIQ" "$CORE"

      - name: Upload artifacts (for debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe-outputs-${{ github.run_id }}
          path: |
            data/output/staging/*/*.manifest.json
            data/output/latest/LATEST_RUN_ID.txt
            logs/*/run.log
          retention-days: 30
          if-no-files-found: warn

      - name: Upload logs (debug)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug-logs-${{ github.run_id }}
          path: |
            logs/**/*
            data/output/**/*
          retention-days: 7
          if-no-files-found: warn
  finalize_run:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    env:
      PHASE4_ROLLOUT_STAGE: "4b"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Supabase runs terminal status
        env:
          PYTHONPATH: src:.
          GITHUB_RUN_ID: ${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ needs.build.result }}" = "success" ]; then
            STATUS="success"
          else
            STATUS="failed"
          fi
          python scripts/storage/control_plane_cli.py update-run \
            --workflow monthly.yml \
            --github-run-id "$GITHUB_RUN_ID" \
            --status "$STATUS" \
            --phase4-rollout-stage "$PHASE4_ROLLOUT_STAGE" \
            --json-output /tmp/monthly_update_run.json

