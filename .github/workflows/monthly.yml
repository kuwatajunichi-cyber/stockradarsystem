name: Monthly Universe Build

on:
  workflow_dispatch:  # 手動実行
  schedule:
    - cron: "0 2 1 * *"  # ??1? 02:00 UTC????? 11:00?
  # Phase 4c: Worker Cron is primary; GH schedule kept until U-3 verified (follow-up removes it)

jobs:
  preflight:
    uses: ./.github/workflows/reusable_quality_gate.yml

  build:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PHASE4_ROLLOUT_STAGE: "4c"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upsert Supabase runs row
        env:
          PYTHONPATH: src:.
          GITHUB_RUN_ID: ${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Tokyo date +%Y-%m-01)"
          python scripts/storage/control_plane_cli.py upsert-run \
            --workflow monthly.yml \
            --github-run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --status running

      - name: Restore JPX URL cache (R2 + Supabase)
        id: restore_jpx_r2
        env:
          PYTHONPATH: src:.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          mkdir -p data/cache
          set +e
          python scripts/storage/cache_bus_cli.py get-jpx-url \
            --local-path data/cache/jpx_latest_url.txt
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || [ ! -f data/cache/jpx_latest_url.txt ]; then
            echo "cache_restored=false" >> "$GITHUB_OUTPUT"
            echo "JPX URL cache miss — cold start" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cache_restored=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore JPX URL cache (GitHub Actions fallback, 4b)
        if: steps.restore_jpx_r2.outputs.cache_restored != 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/cache/jpx_latest_url.txt
          key: jpx-url-${{ github.run_id }}
          restore-keys: |
            jpx-url-

      - name: Run monthly build
        env:
          PYTHONPATH: src
          LIQ_MIN_MEDIAN_TURNOVER_YEN: ${{ secrets.LIQ_MIN_MEDIAN_TURNOVER_YEN || '20000000' }}
        run: |
          set -euo pipefail
          python scripts/run_monthly.py

      - name: Get run ID from output
        id: get_run_id
        if: success()
        run: |
          set -euo pipefail
          RUN_ID="$(cat data/output/latest/LATEST_RUN_ID.txt 2>/dev/null || echo "")"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(find data/output/staging -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort -r | head -1 || echo "")"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve build date and monthly tag
        id: build_meta
        if: success() && steps.get_run_id.outputs.run_id != ''
        run: |
          set -euo pipefail
          echo "date=$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "snapshot_date=$(TZ=Asia/Tokyo date +%Y-%m-01)" >> "$GITHUB_OUTPUT"
          echo "monthly_tag=monthly-$(TZ=Asia/Tokyo date +%Y%m%d)-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Commit monthly snapshot (R2 + Supabase)
        if: success() && steps.get_run_id.outputs.run_id != ''
        env:
          PYTHONPATH: src:.
          GITHUB_RUN_ID: ${{ github.run_id }}
          PHASE4_ROLLOUT_STAGE: ${{ env.PHASE4_ROLLOUT_STAGE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          STAGING="data/output/staging/${{ steps.get_run_id.outputs.run_id }}"
          python scripts/storage/monthly_bus_cli.py commit-snapshot \
            --staging-dir "$STAGING" \
            --monthly-tag "${{ steps.build_meta.outputs.monthly_tag }}" \
            --snapshot-date "${{ steps.build_meta.outputs.snapshot_date }}" \
            --github-run-id "$GITHUB_RUN_ID" \
            --phase4-rollout-stage "$PHASE4_ROLLOUT_STAGE" \
            --json-output /tmp/monthly_snapshot_commit.json

      - name: Put JPX URL cache (R2 + Supabase RPC)
        if: success() && steps.get_run_id.outputs.run_id != ''
        env:
          PYTHONPATH: src:.
          GITHUB_RUN_ID: ${{ github.run_id }}
          PHASE4_ROLLOUT_STAGE: ${{ env.PHASE4_ROLLOUT_STAGE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          if [ -f data/cache/jpx_latest_url.txt ]; then
            python scripts/storage/cache_bus_cli.py put-jpx-url \
              --local-path data/cache/jpx_latest_url.txt \
              --github-run-id "$GITHUB_RUN_ID" \
              --phase4-rollout-stage "$PHASE4_ROLLOUT_STAGE" \
              --json-output /tmp/jpx_url_put.json
          fi

      - name: Save JPX URL cache (GitHub Actions fallback, 4b)
        if: success() && steps.get_run_id.outputs.run_id != ''
        uses: actions/cache/save@v4
        with:
          path: data/cache/jpx_latest_url.txt
          key: jpx-url-${{ github.run_id }}

      - name: Install deps for multi-target upload
        if: success() && steps.get_run_id.outputs.run_id != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3

      - name: Upload latest 3 CSVs to all targets (work)
        if: success() && steps.get_run_id.outputs.run_id != ''
        env:
          PYTHONPATH: .
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_BASE_FOLDER: ${{ secrets.DROPBOX_BASE_FOLDER }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          RUN_ID="${{ steps.get_run_id.outputs.run_id }}"
          RUN_DATE="${{ steps.build_meta.outputs.snapshot_date }}"
          STAGING="data/output/staging/$RUN_ID"
          IPO="$STAGING/equity_domestic_ipo_with_name.csv"
          ILLIQ="$STAGING/equity_domestic_illiquid_with_name.csv"
          CORE="$STAGING/equity_domestic_core_with_name.csv"
          for f in "$IPO" "$ILLIQ" "$CORE"; do
            if [ ! -f "$f" ]; then
              echo "エラー: 月次成果物が見つかりません: $f"
              exit 1
            fi
          done
          TARGETS="r2,dropbox"
          if [ -n "$GDRIVE_OAUTH_CLIENT_ID" ] && [ -n "$GDRIVE_OAUTH_REFRESH_TOKEN" ]; then
            TARGETS="drive,r2,dropbox"
          fi
          python scripts/upload_to_all_targets.py --run-date "$RUN_DATE" --targets "$TARGETS" --files "$IPO" "$ILLIQ" "$CORE"

      - name: Upload artifacts (for debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe-outputs-${{ github.run_id }}
          path: |
            data/output/staging/*/*.manifest.json
            data/output/latest/LATEST_RUN_ID.txt
            logs/*/run.log
          retention-days: 30
          if-no-files-found: warn

      - name: Upload logs (debug)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug-logs-${{ github.run_id }}
          path: |
            logs/**/*
            data/output/**/*
          retention-days: 7
          if-no-files-found: warn

  finalize_run:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    env:
      PHASE4_ROLLOUT_STAGE: "4c"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Supabase runs terminal status
        env:
          PYTHONPATH: src:.
          GITHUB_RUN_ID: ${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ needs.build.result }}" = "success" ]; then
            STATUS="success"
          else
            STATUS="failed"
          fi
          python scripts/storage/control_plane_cli.py update-run \
            --workflow monthly.yml \
            --github-run-id "$GITHUB_RUN_ID" \
            --status "$STATUS" \
            --phase4-rollout-stage "$PHASE4_ROLLOUT_STAGE" \
            --json-output /tmp/monthly_update_run.json
