# Supabase control plane smoke (Secrets required).
# Run via workflow_dispatch before the first business-day daily run.
name: Supabase Control Plane Smoke

on:
  workflow_dispatch:

env:
  TZ: Asia/Tokyo
  PHASE3_ROLLOUT_STAGE: "3c"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upsert runs row (same path as daily.yml)
        env:
          PYTHONPATH: src:.
          GITHUB_RUN_ID: ${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python scripts/storage/control_plane_cli.py upsert-run \
            --workflow supabase_smoketest.yml \
            --github-run-id "$GITHUB_RUN_ID" \
            --run-date "2026-01-01" \
            --status running \
            --json-output /tmp/smoke_upsert_run.json

      - name: Run Supabase control plane smoke
        env:
          PYTHONPATH: src:.
          GITHUB_RUN_ID: ${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python scripts/smoke/supabase_control_plane_smoke.py 2>&1 | tee smoke_stdout.txt
          exitcode=${PIPESTATUS[0]}
          if [ "$exitcode" -ne 0 ]; then
            echo "::error::Supabase smoke failed with exit $exitcode"
            exit "$exitcode"
          fi

      - name: Write smoke Step Summary
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Supabase control plane smoke"
            echo "- workflow: \`supabase_smoketest.yml\`"
            echo "- github_run_id: \`${GITHUB_RUN_ID}\`"
            echo "- phase3_rollout_stage: \`${{ env.PHASE3_ROLLOUT_STAGE }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/smoke_upsert_run.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/smoke_upsert_run.json").read_text(encoding="utf-8"))
          print(f"- upsert_run_status: \`{payload.get('status', 'unknown')}\`")
          if "run_id" in payload:
              print(f"- upsert_run_id: \`{payload['run_id']}\`")
          PY
          fi
          if [ -f smoke_stdout.txt ] && grep -q "smoke ok:" smoke_stdout.txt; then
            echo "- smoke_status: \`ok\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- checks: \`upsert-run, artifact_index REST, commit_fixed_cache RPC\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- smoke_status: \`failed\`" >> "$GITHUB_STEP_SUMMARY"
            if [ -f smoke_stdout.txt ]; then
              {
                echo "### smoke log (tail)"
                echo '```'
                tail -n 20 smoke_stdout.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi