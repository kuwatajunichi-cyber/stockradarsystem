name: Daily Indicators

# Contract summary:
# - Phase 2c: R2-only run-internal artifact bus (no GitHub artifact upload/download).
# - Phase 3c: warm cache via R2 cache/ + Supabase cache_index/cache_pointers (no actions/cache).
# - Producer: artifact_bus_cli.py put fails the job on R2 error (required artifacts).
# - Consumer: artifact_bus_cli.py get fails the job on R2 error (required artifacts).
# - skip_publish=true skips Upload to all targets step only; render_and_upload job still runs.
# - Patched universe cache is written only by daily_universe_patch.yml; daily.yml restores via get-patched.

on:
  workflow_dispatch:  # 手動実行
    inputs:
      run_date:
        description: "日次アンカー YYYY-MM-DD（空=今日。今日以外は replay: 過去3カレンダー月以内のみ）"
        required: false
        default: ""
      skip_publish:
        description: "true のとき外部公開 step（Upload to all targets）のみスキップ。render_and_upload job は handoff 検証のため実行"
        type: boolean
        default: false
      force_index:
        description: "ensure_index_cache に --force（ベンチティッカー変更後のキャッシュ取り直し用）"
        type: boolean
        default: false
  # Phase 1 (Issue #93): 定時起動は Cloudflare Cron → workflow_dispatch が正系。
  # GitHub schedule は二重起動防止のため削除。ロールバック手順: docs/operations/cloudflare_github_cron.md

concurrency:
  group: daily-indicators
  cancel-in-progress: false  # 同一workflowの多重起動禁止（前回をキャンセルしない）

permissions:
  contents: write

env:
  PHASE3_ROLLOUT_STAGE: "3c"
  PHASE4_ROLLOUT_STAGE: "4c"

jobs:
  preflight:
    uses: ./.github/workflows/reusable_quality_gate.yml

  resolve_trading_day:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      run_date: ${{ steps.resolve.outputs.run_date }}
      is_open: ${{ steps.resolve.outputs.is_open }}
      is_replay: ${{ steps.validate_dispatch.outputs.is_replay }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate dispatch run_date and is_replay
        id: validate_dispatch
        env:
          INPUT_RUN_DATE: ${{ github.event.inputs.run_date || '' }}
          PYTHONPATH: src
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m stockradar.jobs.validate_daily_dispatch_run_date
          else
            echo "is_replay=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve trading day
        id: resolve
        env:
          INPUT_RUN_DATE: ${{ github.event.inputs.run_date || '' }}
          PYTHONPATH: src
        run: |
          set -euo pipefail
          if [ -n "${INPUT_RUN_DATE:-}" ]; then
            OUTPUT=$(python -m stockradar.jobs.resolve_trading_day --date "$INPUT_RUN_DATE")
          else
            OUTPUT=$(python -m stockradar.jobs.resolve_trading_day)
          fi
          RUN_DATE=$(echo "$OUTPUT" | grep "^run_date=" | cut -d= -f2)
          IS_OPEN=$(echo "$OUTPUT" | grep "^is_open=" | cut -d= -f2)
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "is_open=$IS_OPEN" >> "$GITHUB_OUTPUT"
          echo "Resolved: run_date=$RUN_DATE, is_open=$IS_OPEN"

      - name: Upsert Supabase runs row
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ steps.resolve.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python scripts/storage/control_plane_cli.py upsert-run \
            --workflow daily.yml \
            --github-run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --status running \
            --json-output /tmp/supabase_upsert_run.json

      - name: Write Supabase upsert-run gate summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## resolve_trading_day Supabase gate"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/supabase_upsert_run.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/supabase_upsert_run.json").read_text(encoding="utf-8"))
          if payload.get("run_id") is not None:
              print(f"- supabase_run_id: `{payload['run_id']}`")
          if payload.get("status") is not None:
              print(f"- upsert_run_status: `{payload['status']}`")
          PY
          else
            echo "- upsert_run_status: \`(json missing — upsert step failed)\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  resolve_core_csv:
    needs: resolve_trading_day
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    outputs:
      core_csv_manifest_key: ${{ steps.r2_put_core_csv.outputs.manifest_logical_key }}
      core_quality_manifest_key: ${{ steps.r2_put_core_quality.outputs.manifest_logical_key }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build monthly tags list (optional at 4c)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHASE4_ROLLOUT_STAGE: ${{ env.PHASE4_ROLLOUT_STAGE }}
        run: |
          set -euo pipefail
          : > /tmp/monthly_tags.txt
          if [ "$PHASE4_ROLLOUT_STAGE" != "4c" ]; then
            gh release list --limit 200 --json tagName --template '{{range .}}{{.tagName}}{{"\n"}}{{end}}' > /tmp/gh_all_tags.txt
            grep '^monthly-' /tmp/gh_all_tags.txt > /tmp/monthly_tags.txt || true
            if [ ! -s /tmp/monthly_tags.txt ]; then
              echo "error: no monthly-* release tags (required before phase 4c)"
              exit 1
            fi
          fi

      - name: Select patched cache key (Supabase; Phase 3c)
        id: core_sel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          PHASE3_ROLLOUT_STAGE: ${{ env.PHASE3_ROLLOUT_STAGE }}
          PHASE4_ROLLOUT_STAGE: ${{ env.PHASE4_ROLLOUT_STAGE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python -m stockradar.jobs.resolve_core_csv select \
            --run-date "$RUN_DATE" \
            --tags-file /tmp/monthly_tags.txt \
            --repo "${{ github.repository }}" \
            --patched-cache-allowed-ref "${{ github.ref }}" \
            --patched-cache-allowed-ref "refs/heads/${{ github.event.repository.default_branch }}" \
            --phase3-rollout-stage "$PHASE3_ROLLOUT_STAGE" \
            --phase4-rollout-stage "$PHASE4_ROLLOUT_STAGE" \
            --monthly-source auto

      - name: Restore patched universe from R2 (conditional)
        if: steps.core_sel.outputs.need_patched_restore == 'true'
        env:
          PYTHONPATH: src:.
          PHASE3_ROLLOUT_STAGE: ${{ env.PHASE3_ROLLOUT_STAGE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          python scripts/storage/cache_bus_cli.py get-patched \
            --cache-key "${{ steps.core_sel.outputs.patched_cache_key }}" \
            --monthly-tag "${{ steps.core_sel.outputs.monthly_tag }}" \
            --run-date "${{ needs.resolve_trading_day.outputs.run_date }}"

      - name: Materialize core CSV + quality JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          python -m stockradar.jobs.resolve_core_csv materialize \
            --repo "${{ github.repository }}"

      - name: R2 put core CSV staging
        id: r2_put_core_csv
        if: success()
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PHASE3_ROLLOUT_STAGE: ${{ env.PHASE3_ROLLOUT_STAGE }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2_producer/resolve_core_csv
          JSON_OUT="/tmp/r2_producer/resolve_core_csv/artifact-daily-core-csv.json"
          python scripts/storage/artifact_bus_cli.py put \
            --entry-id artifact-daily-core-csv \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --source-name "daily-core-csv-$GITHUB_RUN_ID" \
            --local-path data/universe/jpx/core_selected_staging/equity_domestic_core_with_name.csv \
            --json-output "$JSON_OUT"
          MANIFEST_KEY=$(python -c "import json; print(json.load(open('$JSON_OUT'))['manifest_logical_key'])")
          echo "manifest_logical_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"

      - name: R2 put core quality staging
        id: r2_put_core_quality
        if: success()
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PHASE3_ROLLOUT_STAGE: ${{ env.PHASE3_ROLLOUT_STAGE }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2_producer/resolve_core_csv
          JSON_OUT="/tmp/r2_producer/resolve_core_csv/artifact-daily-core-quality.json"
          python scripts/storage/artifact_bus_cli.py put \
            --entry-id artifact-daily-core-quality \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --source-name "daily-core-quality-$GITHUB_RUN_ID" \
            --local-path data/universe/jpx/core_selected_staging/core_selection.json \
            --json-output "$JSON_OUT"
          MANIFEST_KEY=$(python -c "import json; print(json.load(open('$JSON_OUT'))['manifest_logical_key'])")
          echo "manifest_logical_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"

      - name: Write resolve_core_csv producer handoff summary
        if: always()
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m stockradar.storage.handoff_summary \
            --mode producer \
            --handoff-dir /tmp/r2_producer/resolve_core_csv \
            --title "resolve_core_csv producer handoff" \
            --required artifact-daily-core-csv artifact-daily-core-quality \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Write resolve_core_csv summary
        if: always()
        run: |
          set -euo pipefail
          Q=data/universe/jpx/core_selected_staging/core_selection.json
          {
            echo "## resolve_core_csv"
            echo "- need_patched_restore: ${{ steps.core_sel.outputs.need_patched_restore }}"
            echo "- patched_cache_key: ${{ steps.core_sel.outputs.patched_cache_key }}"
            echo "- monthly_tag: ${{ steps.core_sel.outputs.monthly_tag }}"
            echo "- cache_source: ${{ steps.core_sel.outputs.cache_source }}"
            echo "- core_csv_manifest_key: ${{ steps.r2_put_core_csv.outputs.manifest_logical_key }}"
            echo "- core_quality_manifest_key: ${{ steps.r2_put_core_quality.outputs.manifest_logical_key }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$Q" ]; then
          {
            echo "### core_selection.json (high-signal)"
          python - <<'PY'
          import json
          from pathlib import Path

          q = json.loads(Path("data/universe/jpx/core_selected_staging/core_selection.json").read_text(encoding="utf-8"))
          print(f"- core_source: `{q.get('core_source')}`")
          print(f"- delisted_patch_applied: `{q.get('delisted_patch_applied')}`")
          print(f"- quality_tier: `{q.get('quality_tier')}`")
          print(f"- selected_cache_key: `{q.get('selected_cache_key')}`")
          PY
            echo '```json'
            cat "$Q"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          fi

  ensure_index_cache:
    needs: resolve_trading_day
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    outputs:
      index_store_manifest_key: ${{ steps.r2_put_index_store.outputs.manifest_logical_key }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore index store zip (R2 warm cache)
        id: restore_index_warm
        env:
          PYTHONPATH: src:.
          PHASE3_ROLLOUT_STAGE: ${{ env.PHASE3_ROLLOUT_STAGE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set +e
          python scripts/storage/cache_bus_cli.py get-fixed \
            --entry-id cache-index-store-zip-v1 \
            --local-path data/cache/index_store_archive/index_store.zip \
            --json-output /tmp/index_warm_get.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Phase 3 warm cache (index): get-fixed miss — cold start" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore index store from zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.restore_index_store

      - name: Ensure index cache
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '31,63,126,252' }}
          BUFFER_DAYS: ${{ secrets.BUFFER_DAYS || '20' }}
        run: |
          set -e
          RD="${{ needs.resolve_trading_day.outputs.run_date }}"
          if [ "${{ github.event.inputs.force_index }}" = "true" ]; then
            python -m stockradar.jobs.ensure_index_cache --run-date "$RD" --force
          else
            python -m stockradar.jobs.ensure_index_cache --run-date "$RD"
          fi

      - name: Archive index store to zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.archive_index_store

      - name: R2 put index store staging
        id: r2_put_index_store
        if: success()
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PHASE3_ROLLOUT_STAGE: ${{ env.PHASE3_ROLLOUT_STAGE }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2_producer/ensure_index_cache
          JSON_OUT="/tmp/r2_producer/ensure_index_cache/artifact-daily-index-store.json"
          python scripts/storage/artifact_bus_cli.py put \
            --entry-id artifact-daily-index-store \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --source-name "daily-index-store-$GITHUB_RUN_ID" \
            --local-path data/cache/index_store_archive/index_store.zip \
            --json-output "$JSON_OUT"
          MANIFEST_KEY=$(python -c "import json; print(json.load(open('$JSON_OUT'))['manifest_logical_key'])")
          echo "manifest_logical_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"

      - name: Put index warm cache (R2 + Supabase)
        if: success()
        env:
          PYTHONPATH: src:.
          GITHUB_RUN_ID: ${{ github.run_id }}
          PHASE3_ROLLOUT_STAGE: ${{ env.PHASE3_ROLLOUT_STAGE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          python scripts/storage/cache_bus_cli.py put-fixed \
            --entry-id cache-index-store-zip-v1 \
            --local-path data/cache/index_store_archive/index_store.zip \
            --github-run-id "$GITHUB_RUN_ID" \
            --is-replay "${{ needs.resolve_trading_day.outputs.is_replay }}" \
            --json-output /tmp/r2_producer/ensure_index_cache/cache-index-store-zip-v1.json

      - name: Write ensure_index_cache producer handoff summary
        if: always()
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m stockradar.storage.handoff_summary \
            --mode producer \
            --handoff-dir /tmp/r2_producer/ensure_index_cache \
            --title "ensure_index_cache producer handoff" \
            --required artifact-daily-index-store \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Write ensure_index_cache summary
        if: always()
        env:
          PYTHONPATH: src
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          set -euo pipefail
          python -m stockradar.storage.phase3_gate_summary \
            --title "ensure_index_cache (Phase 3c gate)" \
            --warm-cache-key index-store-zip-v1 \
            --get-json /tmp/index_warm_get.json \
            --put-json /tmp/r2_producer/ensure_index_cache/cache-index-store-zip-v1.json \
            --fallback-cache-source "${{ steps.restore_index_warm.outputs.cache_source }}" \
            --extra-line "- run_date: \`$RUN_DATE\`" \
            --extra-line "- index_zip: \`data/cache/index_store_archive/index_store.zip\`" \
            --extra-line "- run_artifact: \`daily-index-store-${{ github.run_id }}\`" \
            --extra-line "- index_store_manifest_key: \`${{ steps.r2_put_index_store.outputs.manifest_logical_key }}\`"

  ensure_core_cache:
    needs: [resolve_trading_day, resolve_core_csv]
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    outputs:
      ohlc_store_manifest_key: ${{ steps.r2_put_ohlc_store.outputs.manifest_logical_key }}
      stale_exclusions_manifest_key: ${{ steps.r2_put_stale_exclusions.outputs.manifest_logical_key }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore OHLC store zip (R2 warm cache)
        env:
          PYTHONPATH: src:.
          PHASE3_ROLLOUT_STAGE: ${{ env.PHASE3_ROLLOUT_STAGE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set +e
          python scripts/storage/cache_bus_cli.py get-fixed \
            --entry-id cache-ohlc-store-zip-v2 \
            --local-path data/cache/ohlc_store_archive/ohlc_store.zip \
            --json-output /tmp/ohlc_warm_get.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Phase 3 warm cache (ohlc): get-fixed miss — cold start" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore OHLC store from zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.restore_ohlc_store

      - name: R2 get core CSV staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2_handoff/ensure_core_cache data/universe/jpx/core_selected_staging
          python scripts/storage/artifact_bus_cli.py get \
            --entry-id artifact-daily-core-csv \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path data/universe/jpx/core_selected_staging/equity_domestic_core_with_name.csv \
            --json-output /tmp/r2_handoff/ensure_core_cache/artifact-daily-core-csv.json

      - name: R2 get core quality staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          python scripts/storage/artifact_bus_cli.py get \
            --entry-id artifact-daily-core-quality \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path data/universe/jpx/core_selected_staging/core_selection.json \
            --json-output /tmp/r2_handoff/ensure_core_cache/artifact-daily-core-quality.json

      - name: Ensure core cache
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '31,63,126,252' }}
          BUFFER_DAYS: ${{ secrets.BUFFER_DAYS || '20' }}
          YF_BATCH_SIZE: ${{ secrets.YF_BATCH_SIZE || '100' }}
          YF_SLEEP_SEC_BETWEEN_BATCHES: ${{ secrets.YF_SLEEP_SEC_BETWEEN_BATCHES || '5' }}
          YF_RETRY_MAX: ${{ secrets.YF_RETRY_MAX || '3' }}
          YF_RETRY_BACKOFF_SEC: ${{ secrets.YF_RETRY_BACKOFF_SEC || '5,15,30' }}
          STALE_ALLOW_CONTINUE_MAX_COUNT: ${{ secrets.STALE_ALLOW_CONTINUE_MAX_COUNT || '9' }}
        run: |
          set -euo pipefail
          RUN_DATE="${{ needs.resolve_trading_day.outputs.run_date }}"
          CORE_CSV="data/universe/jpx/core_selected_staging/equity_domestic_core_with_name.csv"
          if [ ! -f "$CORE_CSV" ]; then
            echo "error: core csv artifact not found at $CORE_CSV"
            exit 1
          fi
          python -m stockradar.jobs.ensure_core_cache --input "$CORE_CSV" --run-date "$RUN_DATE"

      - name: Write ensure_core_cache summary
        if: always()
        env:
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          run_date = os.environ.get("RUN_DATE", "")
          exclusions = Path("data/cache/yf_daily/_stale_exclusions.json")
          quality = Path("data/universe/jpx/core_selected_staging/core_selection.json")
          lines = ["## ensure_core_cache summary", f"- run_date: `{run_date}`"]
          if quality.exists():
            q = json.loads(quality.read_text(encoding="utf-8"))
            lines.append(f"- core_source: `{q.get('core_source')}`")
            lines.append(f"- delisted_patch_applied: `{q.get('delisted_patch_applied')}`")
            lines.append(f"- quality_tier: `{q.get('quality_tier')}`")
            lines.append(f"- MONTHLY_TAG: `{q.get('MONTHLY_TAG')}`")
            lines.append(f"- selected_cache_key: `{q.get('selected_cache_key')}`")
          else:
            lines.append("- core_selection.json: `not found`")
          if exclusions.exists():
            payload = json.loads(exclusions.read_text(encoding="utf-8"))
            stale_count = int(payload.get("stale_count", 0) or 0)
            threshold = int(payload.get("threshold", 0) or 0)
            stale_codes = payload.get("stale_codes") or []
            preview = ", ".join(str(c) for c in stale_codes[:20])
            if len(stale_codes) > 20:
              preview += ", ..."
            lines.append(f"- stale_count: `{stale_count}` (continue_threshold: `{threshold}`)")
            lines.append(f"- stale_codes_preview: `{preview or '-'}`")
          else:
            lines.append("- stale exclusions file: `not found`")
          lines.append("- idempotency_contract: `checked in preflight tests`")
          rid = os.environ.get("GITHUB_RUN_ID", "")
          lines.append(f"- run_artifact: `daily-ohlc-store-{rid}`")
          with summary_path.open("a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Archive OHLC store to zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.archive_ohlc_store

      # compute は別ランナー。Run 内の入力は R2 get 正系（Phase 2c R2-only）。
      - name: R2 put OHLC store staging
        id: r2_put_ohlc_store
        if: success()
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PHASE3_ROLLOUT_STAGE: ${{ env.PHASE3_ROLLOUT_STAGE }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2_producer/ensure_core_cache
          JSON_OUT="/tmp/r2_producer/ensure_core_cache/artifact-daily-ohlc-store.json"
          python scripts/storage/artifact_bus_cli.py put \
            --entry-id artifact-daily-ohlc-store \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --source-name "daily-ohlc-store-$GITHUB_RUN_ID" \
            --local-path data/cache/ohlc_store_archive/ohlc_store.zip \
            --json-output "$JSON_OUT"
          MANIFEST_KEY=$(python -c "import json; print(json.load(open('$JSON_OUT'))['manifest_logical_key'])")
          echo "manifest_logical_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"

      - name: Put OHLC warm cache (R2 + Supabase)
        if: success()
        env:
          PYTHONPATH: src:.
          GITHUB_RUN_ID: ${{ github.run_id }}
          PHASE3_ROLLOUT_STAGE: ${{ env.PHASE3_ROLLOUT_STAGE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          python scripts/storage/cache_bus_cli.py put-fixed \
            --entry-id cache-ohlc-store-zip-v2 \
            --local-path data/cache/ohlc_store_archive/ohlc_store.zip \
            --github-run-id "$GITHUB_RUN_ID" \
            --is-replay "${{ needs.resolve_trading_day.outputs.is_replay }}" \
            --json-output /tmp/r2_producer/ensure_core_cache/cache-ohlc-store-zip-v2.json

      - name: R2 put stale exclusions staging
        id: r2_put_stale_exclusions
        if: always()
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PHASE3_ROLLOUT_STAGE: ${{ env.PHASE3_ROLLOUT_STAGE }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2_producer/ensure_core_cache
          JSON_OUT="/tmp/r2_producer/ensure_core_cache/artifact-stale-exclusions.json"
          STALE_PATH="data/cache/yf_daily/_stale_exclusions.json"
          if [ -f "$STALE_PATH" ]; then
            python scripts/storage/artifact_bus_cli.py put \
              --entry-id artifact-stale-exclusions \
              --run-id "$GITHUB_RUN_ID" \
              --run-date "$RUN_DATE" \
              --source-name "stale-exclusions-$GITHUB_RUN_ID" \
              --local-path "$STALE_PATH" \
              --json-output "$JSON_OUT"
            MANIFEST_KEY=$(python -c "import json; print(json.load(open('$JSON_OUT'))['manifest_logical_key'])")
            echo "manifest_logical_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Write ensure_core_cache producer handoff summary
        if: always()
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m stockradar.storage.handoff_summary \
            --mode producer \
            --handoff-dir /tmp/r2_producer/ensure_core_cache \
            --title "ensure_core_cache producer handoff" \
            --required artifact-daily-ohlc-store \
            --optional artifact-stale-exclusions \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Write ensure_core_cache Phase 3c cache gate summary
        if: always()
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m stockradar.storage.phase3_gate_summary \
            --title "ensure_core_cache warm cache (Phase 3c gate)" \
            --warm-cache-key ohlc-store-zip-v2 \
            --get-json /tmp/ohlc_warm_get.json \
            --put-json /tmp/r2_producer/ensure_core_cache/cache-ohlc-store-zip-v2.json

      - name: Write ensure_core_cache artifact handoff summary
        if: always()
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          {
            python -m stockradar.storage.handoff_summary \
              --handoff-dir /tmp/r2_handoff/ensure_core_cache \
              --title "ensure_core_cache artifact handoff" \
              --required artifact-daily-core-csv artifact-daily-core-quality
          } >> "$GITHUB_STEP_SUMMARY"

  compute_indicators:
    needs: [resolve_trading_day, resolve_core_csv, ensure_index_cache, ensure_core_cache]
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    outputs:
      daily_indicators_manifest_key: ${{ steps.r2_put_indicators.outputs.manifest_logical_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: R2 get OHLC store staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2_handoff/compute_indicators data/cache/ohlc_store_archive
          python scripts/storage/artifact_bus_cli.py get \
            --entry-id artifact-daily-ohlc-store \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path data/cache/ohlc_store_archive/ohlc_store.zip \
            --json-output /tmp/r2_handoff/compute_indicators/artifact-daily-ohlc-store.json

      - name: R2 get stale exclusions staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2_handoff/compute_indicators data/cache/yf_daily
          python scripts/storage/artifact_bus_cli.py get \
            --entry-id artifact-stale-exclusions \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path data/cache/yf_daily/_stale_exclusions.json \
            --json-output /tmp/r2_handoff/compute_indicators/artifact-stale-exclusions.json

      - name: R2 get index store staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2_handoff/compute_indicators data/cache/index_store_archive
          python scripts/storage/artifact_bus_cli.py get \
            --entry-id artifact-daily-index-store \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path data/cache/index_store_archive/index_store.zip \
            --json-output /tmp/r2_handoff/compute_indicators/artifact-daily-index-store.json

      - name: R2 get core CSV staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2_handoff/compute_indicators data/universe/jpx/core_selected_staging
          python scripts/storage/artifact_bus_cli.py get \
            --entry-id artifact-daily-core-csv \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path data/universe/jpx/core_selected_staging/equity_domestic_core_with_name.csv \
            --json-output /tmp/r2_handoff/compute_indicators/artifact-daily-core-csv.json

      - name: R2 get core quality staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          python scripts/storage/artifact_bus_cli.py get \
            --entry-id artifact-daily-core-quality \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path data/universe/jpx/core_selected_staging/core_selection.json \
            --json-output /tmp/r2_handoff/compute_indicators/artifact-daily-core-quality.json

      - name: Restore index store from zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.restore_index_store

      - name: Restore OHLC store from zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.restore_ohlc_store

      - name: Compute indicators
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '31,63,126,252' }}
          RS_BENCHMARK: ${{ secrets.RS_BENCHMARK || 'BOTH' }}
        run: |
          set -euo pipefail
          RUN_DATE="${{ needs.resolve_trading_day.outputs.run_date }}"
          CORE_CSV="data/universe/jpx/core_selected_staging/equity_domestic_core_with_name.csv"
          if [ ! -f "$CORE_CSV" ]; then
            echo "error: core csv artifact not found at $CORE_CSV"
            exit 1
          fi
          python -m stockradar.jobs.compute_indicators_for_core --input "$CORE_CSV" --run-date "$RUN_DATE"

      - name: Write compute_indicators summary
        if: always()
        env:
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          run_date = os.environ.get("RUN_DATE", "")
          exclusions = Path("data/cache/yf_daily/_stale_exclusions.json")
          quality = Path("data/universe/jpx/core_selected_staging/core_selection.json")
          lines = ["## compute_indicators summary", f"- run_date: `{run_date}`"]
          if quality.exists():
            q = json.loads(quality.read_text(encoding="utf-8"))
            lines.append(f"- core_source: `{q.get('core_source')}`")
            lines.append(f"- delisted_patch_applied: `{q.get('delisted_patch_applied')}`")
            lines.append(f"- quality_tier: `{q.get('quality_tier')}`")
            lines.append(f"- selected_cache_key: `{q.get('selected_cache_key')}`")
          else:
            lines.append("- core_selection.json: `not found`")
          if exclusions.exists():
            payload = json.loads(exclusions.read_text(encoding="utf-8"))
            file_run_date = str(payload.get("run_date") or "")
            stale_count = int(payload.get("stale_count", 0) or 0)
            codes = payload.get("stale_codes") or []
            applicable = file_run_date == run_date
            lines.append(f"- stale_exclusions_file_run_date: `{file_run_date or '-'}'")
            lines.append(f"- stale_exclusions_applicable: `{applicable}`")
            lines.append(f"- excluded_by_stale_policy_expected: `{stale_count if applicable else 0}`")
            preview = ", ".join(str(c) for c in codes[:20])
            if len(codes) > 20:
              preview += ", ..."
            lines.append(f"- stale_codes_preview: `{preview or '-'}`")
          else:
            lines.append("- stale exclusions file: `not found`")
          lines.append("- performance_contract: `processed/workers/elapsed_sec logged by job`")
          with summary_path.open("a", encoding="utf-8") as f:
            f.write("\n".join(lines) + "\n")
          PY

      - name: Resolve indicators csv path
        id: indicators_csv
        env:
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          set -euo pipefail
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          echo "path=data/indicators/daily/indicators_${RUN_DATE_COMPACT}.csv" >> "$GITHUB_OUTPUT"

      - name: R2 put indicators staging
        id: r2_put_indicators
        if: success()
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          INDICATORS_PATH: ${{ steps.indicators_csv.outputs.path }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PHASE3_ROLLOUT_STAGE: ${{ env.PHASE3_ROLLOUT_STAGE }}
        run: |
          set -euo pipefail
          if [ ! -f "$INDICATORS_PATH" ]; then
            echo "error: expected indicators file missing: $INDICATORS_PATH"
            exit 1
          fi
          mkdir -p /tmp/r2_producer/compute_indicators
          JSON_OUT="/tmp/r2_producer/compute_indicators/artifact-daily-indicators.json"
          python scripts/storage/artifact_bus_cli.py put \
            --entry-id artifact-daily-indicators \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --source-name "daily-indicators-$RUN_DATE" \
            --local-path "$INDICATORS_PATH" \
            --json-output "$JSON_OUT"
          MANIFEST_KEY=$(python -c "import json; print(json.load(open('$JSON_OUT'))['manifest_logical_key'])")
          echo "manifest_logical_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"

      - name: Write compute_indicators producer handoff summary
        if: always()
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m stockradar.storage.handoff_summary \
            --mode producer \
            --handoff-dir /tmp/r2_producer/compute_indicators \
            --title "compute_indicators producer handoff" \
            --required artifact-daily-indicators \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Write compute_indicators artifact handoff summary
        if: always()
        env:
          PYTHONPATH: src
          DAILY_INDICATORS_MANIFEST_KEY: ${{ steps.r2_put_indicators.outputs.manifest_logical_key }}
        run: |
          set -euo pipefail
          set +e
          python -m stockradar.storage.handoff_summary \
            --handoff-dir /tmp/r2_handoff/compute_indicators \
            --title "compute_indicators artifact handoff" \
            --required artifact-daily-ohlc-store artifact-daily-index-store artifact-daily-core-csv artifact-daily-core-quality \
            --optional artifact-stale-exclusions \
            >> "$GITHUB_STEP_SUMMARY"
          RC=$?
          set -e
          if [ -n "${DAILY_INDICATORS_MANIFEST_KEY:-}" ]; then
            echo "- daily_indicators_manifest_key: \`${DAILY_INDICATORS_MANIFEST_KEY}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$RC"

  # Phase 4.5 derived writer (shadow until mapping phase4_5_rollout_stage > off).
  # Rollout stage SSOT: config/github_state_to_r2_supabase_mapping.yaml only (no scheduled PHASE4_5_ROLLOUT_STAGE env).
  write_derived_generation:
    needs: [resolve_trading_day, compute_indicators]
    if: needs.resolve_trading_day.outputs.is_open == 'True' && needs.compute_indicators.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve Phase 4.5 rollout stage from mapping
        id: phase45
        run: |
          set -euo pipefail
          STAGE=$(python -c "import yaml; from pathlib import Path; m=yaml.safe_load(Path('config/github_state_to_r2_supabase_mapping.yaml').read_text(encoding='utf-8')); print(m.get('phase4_5_rollout_stage','off'))")
          echo "rollout_stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: R2 get indicators for derived writer
        if: steps.phase45.outputs.rollout_stage != 'off'
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          mkdir -p /tmp/r2_handoff/write_derived_generation data/indicators/daily
          python scripts/storage/artifact_bus_cli.py get \
            --entry-id artifact-daily-indicators \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path "data/indicators/daily/indicators_${RUN_DATE_COMPACT}.csv" \
            --json-output /tmp/r2_handoff/write_derived_generation/artifact-daily-indicators.json

      - name: Phase A-B-C preflight
        if: steps.phase45.outputs.rollout_stage != 'off'
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python -c "from stockradar.storage.phase4_5_rollout import preflight_derived_write; r=preflight_derived_write('${{ steps.phase45.outputs.rollout_stage }}','normal'); print('preflight', r.value); exit(2 if r.name=='EXIT2' else 0)"

      - name: Write derived generation (normal)
        if: steps.phase45.outputs.rollout_stage != 'off'
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          IS_REPLAY: ${{ needs.resolve_trading_day.outputs.is_replay }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PHASE45_SHADOW_METRIC_SET_ID: "11111111-2222-3333-4444-555555555555"
        run: |
          set -euo pipefail
          MODE=normal
          IS_LATEST=true
          LIFECYCLE=shadow
          if [ "$(echo "$IS_REPLAY" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
            MODE=replay
            IS_LATEST=false
          fi
          if [ "${{ steps.phase45.outputs.rollout_stage }}" = "4.5c" ] && [ "$MODE" = "normal" ]; then
            LIFECYCLE=active
          fi
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          INDICATORS_CSV="data/indicators/daily/indicators_${RUN_DATE_COMPACT}.csv"
          SNAPSHOT_JSON="/tmp/derived_snapshot_${RUN_DATE_COMPACT}.json"
          python scripts/storage/indicators_csv_to_snapshot_json.py \
            --csv "$INDICATORS_CSV" \
            --metric-set-yaml config/metrics/metric_set_v1_free.yaml \
            --output "$SNAPSHOT_JSON"
          LAYER1_FP=$(python -c "import hashlib; from pathlib import Path; p=Path('$INDICATORS_CSV'); print(hashlib.sha256(p.read_bytes()).hexdigest())")
          METRIC_SET_ARGS=()
          if [ "${{ steps.phase45.outputs.rollout_stage }}" = "4.5a" ] || [ "${{ steps.phase45.outputs.rollout_stage }}" = "4.5b" ]; then
            export DERIVED_GENERATION_FAKE=1
            METRIC_SET_ARGS=(--metric-set-version-id "$PHASE45_SHADOW_METRIC_SET_ID")
          fi
          python scripts/storage/derived_bus_cli.py put-generation \
            --mode "$MODE" \
            --trade-date "$RUN_DATE" \
            --phase4-5-rollout-stage "${{ steps.phase45.outputs.rollout_stage }}" \
            "${METRIC_SET_ARGS[@]}" \
            --lifecycle-status "$LIFECYCLE" \
            --metric-set-yaml config/metrics/metric_set_v1_free.yaml \
            --snapshot-json "$SNAPSHOT_JSON" \
            --layer1-input-fingerprint "$LAYER1_FP" \
            --workflow daily.yml \
            --github-run-id "$GITHUB_RUN_ID" \
            --is-current-latest-trade-date "$IS_LATEST" \
            --json-output /tmp/derived_daily_normal.json

      - name: Write derived generation skip summary
        if: always()
        run: |
          {
            echo "## write_derived_generation"
            echo "- rollout_stage: \`${{ steps.phase45.outputs.rollout_stage }}\`"
            echo "- mapping_ssot: \`config/github_state_to_r2_supabase_mapping.yaml\`"
          } >> "$GITHUB_STEP_SUMMARY"

  event_cause_enrichment:
    uses: ./.github/workflows/daily_event_cause_enrichment.yml
    needs: [resolve_trading_day, compute_indicators]
    if: |
      needs.resolve_trading_day.outputs.is_open == 'True' &&
      needs.compute_indicators.result == 'success'
    with:
      run_date: ${{ needs.resolve_trading_day.outputs.run_date }}
    secrets: inherit

  render_and_upload:
    needs: [resolve_trading_day, compute_indicators, event_cause_enrichment]
    outputs:
      upload_status: ${{ steps.multi_upload.outputs.upload_status }}
    if: |
      always() &&
      needs.resolve_trading_day.outputs.is_open == 'True' &&
      needs.compute_indicators.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: R2 get indicators staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          mkdir -p /tmp/r2_handoff/render_and_upload data/indicators/daily
          python scripts/storage/artifact_bus_cli.py get \
            --entry-id artifact-daily-indicators \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path "data/indicators/daily/indicators_${RUN_DATE_COMPACT}.csv" \
            --json-output /tmp/r2_handoff/render_and_upload/artifact-daily-indicators.json

      - name: R2 get enriched CSV staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          mkdir -p data/indicators/daily
          python scripts/storage/artifact_bus_cli.py get \
            --entry-id artifact-enriched-csv \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path "data/indicators/daily/indicators_event_enriched_${RUN_DATE_COMPACT}.csv" \
            --json-output /tmp/r2_handoff/render_and_upload/artifact-enriched-csv.json

      - name: Select CSV and render XLSX
        id: render
        env:
          PYTHONPATH: .
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          set -euo pipefail
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          ENRICHED="data/indicators/daily/indicators_event_enriched_${RUN_DATE_COMPACT}.csv"
          BASE="data/indicators/daily/indicators_${RUN_DATE_COMPACT}.csv"
          if [ -f "$ENRICHED" ]; then
            CSV_PATH="$ENRICHED"
            echo "Using enriched CSV"
          else
            CSV_PATH="$BASE"
            echo "Using base indicators CSV"
          fi
          if [ ! -f "$CSV_PATH" ]; then
            echo "エラー: CSV が見つかりません: $CSV_PATH"
            exit 1
          fi
          OUT=$(python scripts/render_sheet/render_sheet.py --input-csv "$CSV_PATH" --config config/render_sheet.yaml 2>&1)
          echo "$OUT"
          XLSX_PATH=$(echo "$OUT" | grep "^output_xlsx=" | cut -d= -f2-)
          if [ -z "$XLSX_PATH" ] || [ ! -f "$XLSX_PATH" ]; then
            XLSX_PATH="data/indicators/daily/${RUN_DATE}_Daily.xlsx"
          fi
          if [ ! -f "$XLSX_PATH" ]; then
            echo "エラー: XLSX が生成されませんでした: $XLSX_PATH"
            exit 1
          fi
          echo "csv_path=$CSV_PATH" >> "$GITHUB_OUTPUT"
          echo "xlsx_path=$XLSX_PATH" >> "$GITHUB_OUTPUT"

      - name: Write render_and_upload artifact handoff summary
        if: always()
        env:
          PYTHONPATH: src
          ENRICHED_MANIFEST_KEY: ${{ needs.event_cause_enrichment.outputs.enriched_manifest_key }}
        run: |
          set -euo pipefail
          set +e
          python -m stockradar.storage.handoff_summary \
            --handoff-dir /tmp/r2_handoff/render_and_upload \
            --title "render_and_upload artifact handoff" \
            --required artifact-daily-indicators \
            --optional artifact-enriched-csv \
            >> "$GITHUB_STEP_SUMMARY"
          RC=$?
          set -e
          if [ -n "${ENRICHED_MANIFEST_KEY:-}" ]; then
            echo "- enriched_manifest_key: \`${ENRICHED_MANIFEST_KEY}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- enriched_manifest_key: \`(optional missing)\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$RC"

      - name: Upload to all targets (R2 / Dropbox; Drive optional)
        id: multi_upload
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_publish != 'true'
        env:
          PYTHONPATH: .
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_BASE_FOLDER: ${{ secrets.DROPBOX_BASE_FOLDER }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CSV_PATH="${{ steps.render.outputs.csv_path }}"
          XLSX_PATH="${{ steps.render.outputs.xlsx_path }}"
          TARGETS="r2,dropbox"
          if [ -n "$GDRIVE_OAUTH_CLIENT_ID" ] && [ -n "$GDRIVE_OAUTH_REFRESH_TOKEN" ]; then
            TARGETS="drive,r2,dropbox"
          fi
          python scripts/upload_to_all_targets.py --run-date "$RUN_DATE" --targets "$TARGETS" --files "$CSV_PATH" "$XLSX_PATH" | tee /tmp/multi_upload.log
          UPLOAD_STATUS=$(grep '^upload_status=' /tmp/multi_upload.log | tail -1 | cut -d= -f2-)
          echo "upload_status=${UPLOAD_STATUS:-ok}" >> "$GITHUB_OUTPUT"

      - name: Publish to R2 published/ + Supabase (Phase 4)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_publish != 'true'
        id: publish_dual
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PHASE4_ROLLOUT_STAGE: ${{ env.PHASE4_ROLLOUT_STAGE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          CSV_PATH="${{ steps.render.outputs.csv_path }}"
          XLSX_PATH="${{ steps.render.outputs.xlsx_path }}"
          CSV_NAME="indicators_${RUN_DATE_COMPACT}.csv"
          XLSX_NAME="${RUN_DATE}_Daily.xlsx"
          python scripts/storage/publish_bus_cli.py commit \
            --github-run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --logical-kind indicators_csv \
            --visibility work \
            --local-path "$CSV_PATH" \
            --filename "$CSV_NAME" \
            --phase4-rollout-stage "$PHASE4_ROLLOUT_STAGE" \
            --json-output /tmp/publish_csv.json
          python scripts/storage/publish_bus_cli.py commit \
            --github-run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --logical-kind indicators_xlsx \
            --visibility paid \
            --local-path "$XLSX_PATH" \
            --filename "$XLSX_NAME" \
            --phase4-rollout-stage "$PHASE4_ROLLOUT_STAGE" \
            --json-output /tmp/publish_xlsx.json

  finalize_run:
    needs: [preflight, resolve_trading_day, compute_indicators, event_cause_enrichment, render_and_upload]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve terminal run status
        id: terminal
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          IS_OPEN="${{ needs.resolve_trading_day.outputs.is_open }}"
          SKIP_PUBLISH="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.skip_publish }}" = "true" ]; then
            SKIP_PUBLISH="true"
          fi
          UPLOAD_EXEC="false"
          UPLOAD_RC="0"
          if [ "${{ needs.render_and_upload.result }}" = "success" ]; then
            UPLOAD_EXEC="true"
            UPLOAD_RC="0"
          elif [ "${{ needs.render_and_upload.result }}" = "failure" ]; then
            UPLOAD_EXEC="true"
            UPLOAD_RC="1"
          fi
          ENRICH_RESULT="${{ needs.event_cause_enrichment.result }}"
          DECISION=$(python -m stockradar.jobs.finalize_daily_run \
            --is-open "$IS_OPEN" \
            --compute-result "${{ needs.compute_indicators.result }}" \
            --enrichment-result "$ENRICH_RESULT" \
            --render-result "${{ needs.render_and_upload.result }}" \
            --skip-publish "$SKIP_PUBLISH" \
            --upload-executed "$UPLOAD_EXEC" \
            --upload-exit-code "$UPLOAD_RC" \
            --upload-status "${{ needs.render_and_upload.outputs.upload_status || 'ok' }}")
          echo "$DECISION"
          STATUS=$(python -c "import json,sys; print(json.loads(sys.argv[1])['status'])" "$DECISION")
          REASON=$(python -c "import json,sys; d=json.loads(sys.argv[1]); print(d.get('degraded_reason') or '')" "$DECISION")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "degraded_reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Update Supabase runs terminal status
        env:
          PYTHONPATH: src:.
          GITHUB_RUN_ID: ${{ github.run_id }}
          PHASE4_ROLLOUT_STAGE: ${{ env.PHASE4_ROLLOUT_STAGE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          ARGS=(
            --workflow daily.yml
            --github-run-id "$GITHUB_RUN_ID"
            --status "${{ steps.terminal.outputs.status }}"
            --degraded-reason "${{ steps.terminal.outputs.degraded_reason }}"
            --phase4-rollout-stage "$PHASE4_ROLLOUT_STAGE"
            --json-output /tmp/supabase_update_run.json
          )
          python scripts/storage/control_plane_cli.py update-run "${ARGS[@]}"
          if [ "${{ steps.terminal.outputs.status }}" = "failed" ]; then
            echo "::error::runs terminal status is failed; failing workflow to match Supabase"
            exit 1
          fi
