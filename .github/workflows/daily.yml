name: Daily Indicators

# Contract summary:
# - Phase 2a: GitHub artifact is primary handoff; R2 runs/ staging is shadow write/read validation.
# - actions/cache/save (this file only): index-store-zip-v1 + ohlc-store-zip-v2 (two writes on success).
# - Patched universe cache is written only by daily_universe_patch.yml; daily.yml restores only.

on:
  workflow_dispatch:  # 手動実行
    inputs:
      run_date:
        description: "日次アンカー YYYY-MM-DD（空=今日。今日以外は replay: 過去3カレンダー月以内のみ）"
        required: false
        default: ""
      skip_publish:
        description: "true のとき render / upload をスキップ（既定は公開する）"
        type: boolean
        default: false
      force_index:
        description: "ensure_index_cache に --force（ベンチティッカー変更後のキャッシュ取り直し用）"
        type: boolean
        default: false
  # Phase 1 (Issue #93): 定時起動は Cloudflare Cron → workflow_dispatch が正系。
  # GitHub schedule は二重起動防止のため削除。ロールバック手順: docs/operations/cloudflare_github_cron.md

concurrency:
  group: daily-indicators
  cancel-in-progress: false  # 同一workflowの多重起動禁止（前回をキャンセルしない）

permissions:
  contents: write

jobs:
  preflight:
    uses: ./.github/workflows/reusable_quality_gate.yml

  resolve_trading_day:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      run_date: ${{ steps.resolve.outputs.run_date }}
      is_open: ${{ steps.resolve.outputs.is_open }}
      is_replay: ${{ steps.validate_dispatch.outputs.is_replay }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate dispatch run_date and is_replay
        id: validate_dispatch
        env:
          INPUT_RUN_DATE: ${{ github.event.inputs.run_date || '' }}
          PYTHONPATH: src
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m stockradar.jobs.validate_daily_dispatch_run_date
          else
            echo "is_replay=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve trading day
        id: resolve
        env:
          INPUT_RUN_DATE: ${{ github.event.inputs.run_date || '' }}
          PYTHONPATH: src
        run: |
          set -euo pipefail
          if [ -n "${INPUT_RUN_DATE:-}" ]; then
            OUTPUT=$(python -m stockradar.jobs.resolve_trading_day --date "$INPUT_RUN_DATE")
          else
            OUTPUT=$(python -m stockradar.jobs.resolve_trading_day)
          fi
          RUN_DATE=$(echo "$OUTPUT" | grep "^run_date=" | cut -d= -f2)
          IS_OPEN=$(echo "$OUTPUT" | grep "^is_open=" | cut -d= -f2)
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "is_open=$IS_OPEN" >> "$GITHUB_OUTPUT"
          echo "Resolved: run_date=$RUN_DATE, is_open=$IS_OPEN"

  resolve_core_csv:
    needs: resolve_trading_day
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    outputs:
      core_csv_manifest_key: ${{ steps.r2_put_core_csv.outputs.manifest_logical_key }}
      core_quality_manifest_key: ${{ steps.r2_put_core_quality.outputs.manifest_logical_key }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build monthly tags list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName --template '{{range .}}{{.tagName}}{{"\n"}}{{end}}' > /tmp/gh_all_tags.txt
          grep '^monthly-' /tmp/gh_all_tags.txt > /tmp/monthly_tags.txt || true
          if [ ! -s /tmp/monthly_tags.txt ]; then
            echo "error: no monthly-* release tags"
            exit 1
          fi

      - name: Select patched cache key (restore-only; no cache save)
        id: core_sel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          set -euo pipefail
          python -m stockradar.jobs.resolve_core_csv select \
            --run-date "$RUN_DATE" \
            --tags-file /tmp/monthly_tags.txt \
            --repo "${{ github.repository }}" \
            --patched-cache-allowed-ref "${{ github.ref }}" \
            --patched-cache-allowed-ref "refs/heads/${{ github.event.repository.default_branch }}"

      - name: Restore patched universe cache (optional)
        if: steps.core_sel.outputs.need_patched_restore == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/universe/jpx/patched_cache
          key: ${{ steps.core_sel.outputs.patched_cache_key }}

      - name: Materialize core CSV + quality JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m stockradar.jobs.resolve_core_csv materialize \
            --repo "${{ github.repository }}"

      - name: Upload core CSV artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: daily-core-csv-${{ github.run_id }}
          path: data/universe/jpx/core_selected_staging/equity_domestic_core_with_name.csv
          retention-days: 3
          if-no-files-found: error

      - name: Upload core quality artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: daily-core-quality-${{ github.run_id }}
          path: data/universe/jpx/core_selected_staging/core_selection.json
          retention-days: 3
          if-no-files-found: error

      - name: R2 shadow put core CSV staging
        id: r2_put_core_csv
        if: success()
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          OUT=$(python scripts/storage/artifact_bus_cli.py put \
            --entry-id artifact-daily-core-csv \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --source-name "daily-core-csv-$GITHUB_RUN_ID" \
            --local-path data/universe/jpx/core_selected_staging/equity_domestic_core_with_name.csv)
          MANIFEST_KEY=$(echo "$OUT" | python -c "import json,sys; print(json.load(sys.stdin)['manifest_logical_key'])")
          echo "manifest_logical_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"

      - name: R2 shadow put core quality staging
        id: r2_put_core_quality
        if: success()
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          OUT=$(python scripts/storage/artifact_bus_cli.py put \
            --entry-id artifact-daily-core-quality \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --source-name "daily-core-quality-$GITHUB_RUN_ID" \
            --local-path data/universe/jpx/core_selected_staging/core_selection.json)
          MANIFEST_KEY=$(echo "$OUT" | python -c "import json,sys; print(json.load(sys.stdin)['manifest_logical_key'])")
          echo "manifest_logical_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"

      - name: Write resolve_core_csv summary
        if: always()
        run: |
          set -euo pipefail
          Q=data/universe/jpx/core_selected_staging/core_selection.json
          {
            echo "## resolve_core_csv"
            echo "- need_patched_restore: ${{ steps.core_sel.outputs.need_patched_restore }}"
            echo "- patched_cache_key: ${{ steps.core_sel.outputs.patched_cache_key }}"
            echo "- monthly_tag: ${{ steps.core_sel.outputs.monthly_tag }}"
            echo "- core_csv_manifest_key: ${{ steps.r2_put_core_csv.outputs.manifest_logical_key }}"
            echo "- core_quality_manifest_key: ${{ steps.r2_put_core_quality.outputs.manifest_logical_key }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$Q" ]; then
          {
            echo "### core_selection.json (high-signal)"
          python - <<'PY'
          import json
          from pathlib import Path

          q = json.loads(Path("data/universe/jpx/core_selected_staging/core_selection.json").read_text(encoding="utf-8"))
          print(f"- core_source: `{q.get('core_source')}`")
          print(f"- delisted_patch_applied: `{q.get('delisted_patch_applied')}`")
          print(f"- quality_tier: `{q.get('quality_tier')}`")
          print(f"- selected_cache_key: `{q.get('selected_cache_key')}`")
          PY
            echo '```json'
            cat "$Q"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          fi

  ensure_index_cache:
    needs: resolve_trading_day
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    outputs:
      index_store_manifest_key: ${{ steps.r2_put_index_store.outputs.manifest_logical_key }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore index store zip (warm cache)
        uses: actions/cache/restore@v4
        with:
          path: data/cache/index_store_archive/index_store.zip
          key: index-store-zip-v1
          restore-keys: |
            index-store-zip-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore index store from zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.restore_index_store

      - name: Ensure index cache
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '31,63,126,252' }}
          BUFFER_DAYS: ${{ secrets.BUFFER_DAYS || '20' }}
        run: |
          set -e
          RD="${{ needs.resolve_trading_day.outputs.run_date }}"
          if [ "${{ github.event.inputs.force_index }}" = "true" ]; then
            python -m stockradar.jobs.ensure_index_cache --run-date "$RD" --force
          else
            python -m stockradar.jobs.ensure_index_cache --run-date "$RD"
          fi

      - name: Archive index store to zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.archive_index_store

      - name: Upload index store artifact for compute
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: daily-index-store-${{ github.run_id }}
          path: data/cache/index_store_archive/index_store.zip
          retention-days: 3
          if-no-files-found: error

      - name: R2 shadow put index store staging
        id: r2_put_index_store
        if: success()
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          OUT=$(python scripts/storage/artifact_bus_cli.py put \
            --entry-id artifact-daily-index-store \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --source-name "daily-index-store-$GITHUB_RUN_ID" \
            --local-path data/cache/index_store_archive/index_store.zip)
          MANIFEST_KEY=$(echo "$OUT" | python -c "import json,sys; print(json.load(sys.stdin)['manifest_logical_key'])")
          echo "manifest_logical_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"

      - name: Delete warm index cache key (avoid save race)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m stockradar.jobs.cache_ops rotate-delete \
            --repo "${{ github.repository }}" \
            --key index-store-zip-v1 \
            --is-replay "${{ needs.resolve_trading_day.outputs.is_replay }}"

      - name: Save index store zip (sole index cache writer in this workflow)
        if: success() && needs.resolve_trading_day.outputs.is_replay != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/cache/index_store_archive/index_store.zip
          key: index-store-zip-v1

      - name: Write ensure_index_cache summary
        if: always()
        env:
          PYTHONPATH: src
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          set -euo pipefail
          {
            echo "## ensure_index_cache"
            echo "- run_date: $RUN_DATE"
            echo "- index_zip: data/cache/index_store_archive/index_store.zip"
            echo "- warm_cache_key: index-store-zip-v1"
            echo "- run_artifact: daily-index-store-${{ github.run_id }}"
            echo "- index_store_manifest_key: ${{ steps.r2_put_index_store.outputs.manifest_logical_key }}"
          } >> "$GITHUB_STEP_SUMMARY"

  ensure_core_cache:
    needs: [resolve_trading_day, resolve_core_csv]
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    outputs:
      ohlc_store_manifest_key: ${{ steps.r2_put_ohlc_store.outputs.manifest_logical_key }}
      stale_exclusions_manifest_key: ${{ steps.r2_put_stale_exclusions.outputs.manifest_logical_key }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore OHLC store zip
        uses: actions/cache/restore@v4
        with:
          path: data/cache/ohlc_store_archive/ohlc_store.zip
          key: ohlc-store-zip-v2
          restore-keys: |
            ohlc-store-zip-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore OHLC store from zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.restore_ohlc_store

      - name: Download resolved core CSV artifact
        uses: actions/download-artifact@v4
        with:
          name: daily-core-csv-${{ github.run_id }}
          path: data/universe/jpx/core_selected_staging/

      - name: Download core quality metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: daily-core-quality-${{ github.run_id }}
          path: data/universe/jpx/core_selected_staging/

      - name: R2 shadow validate core CSV staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2_shadow/ensure_core_cache
          python scripts/storage/artifact_bus_cli.py shadow-validate \
            --entry-id artifact-daily-core-csv \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path data/universe/jpx/core_selected_staging/equity_domestic_core_with_name.csv \
            --json-output /tmp/r2_shadow/ensure_core_cache/core_csv.json

      - name: R2 shadow validate core quality staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          python scripts/storage/artifact_bus_cli.py shadow-validate \
            --entry-id artifact-daily-core-quality \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path data/universe/jpx/core_selected_staging/core_selection.json \
            --json-output /tmp/r2_shadow/ensure_core_cache/core_quality.json

      - name: Ensure core cache
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '31,63,126,252' }}
          BUFFER_DAYS: ${{ secrets.BUFFER_DAYS || '20' }}
          YF_BATCH_SIZE: ${{ secrets.YF_BATCH_SIZE || '100' }}
          YF_SLEEP_SEC_BETWEEN_BATCHES: ${{ secrets.YF_SLEEP_SEC_BETWEEN_BATCHES || '5' }}
          YF_RETRY_MAX: ${{ secrets.YF_RETRY_MAX || '3' }}
          YF_RETRY_BACKOFF_SEC: ${{ secrets.YF_RETRY_BACKOFF_SEC || '5,15,30' }}
          STALE_ALLOW_CONTINUE_MAX_COUNT: ${{ secrets.STALE_ALLOW_CONTINUE_MAX_COUNT || '9' }}
        run: |
          set -euo pipefail
          RUN_DATE="${{ needs.resolve_trading_day.outputs.run_date }}"
          CORE_CSV="data/universe/jpx/core_selected_staging/equity_domestic_core_with_name.csv"
          if [ ! -f "$CORE_CSV" ]; then
            echo "error: core csv artifact not found at $CORE_CSV"
            exit 1
          fi
          python -m stockradar.jobs.ensure_core_cache --input "$CORE_CSV" --run-date "$RUN_DATE"

      - name: Write ensure_core_cache summary
        if: always()
        env:
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          run_date = os.environ.get("RUN_DATE", "")
          exclusions = Path("data/cache/yf_daily/_stale_exclusions.json")
          quality = Path("data/universe/jpx/core_selected_staging/core_selection.json")
          lines = ["## ensure_core_cache summary", f"- run_date: `{run_date}`"]
          if quality.exists():
            q = json.loads(quality.read_text(encoding="utf-8"))
            lines.append(f"- core_source: `{q.get('core_source')}`")
            lines.append(f"- delisted_patch_applied: `{q.get('delisted_patch_applied')}`")
            lines.append(f"- quality_tier: `{q.get('quality_tier')}`")
            lines.append(f"- MONTHLY_TAG: `{q.get('MONTHLY_TAG')}`")
            lines.append(f"- selected_cache_key: `{q.get('selected_cache_key')}`")
          else:
            lines.append("- core_selection.json: `not found`")
          if exclusions.exists():
            payload = json.loads(exclusions.read_text(encoding="utf-8"))
            stale_count = int(payload.get("stale_count", 0) or 0)
            threshold = int(payload.get("threshold", 0) or 0)
            stale_codes = payload.get("stale_codes") or []
            preview = ", ".join(str(c) for c in stale_codes[:20])
            if len(stale_codes) > 20:
              preview += ", ..."
            lines.append(f"- stale_count: `{stale_count}` (continue_threshold: `{threshold}`)")
            lines.append(f"- stale_codes_preview: `{preview or '-'}`")
          else:
            lines.append("- stale exclusions file: `not found`")
          lines.append("- idempotency_contract: `checked in preflight tests`")
          lines.append("- warm_cache_key: `ohlc-store-zip-v2`")
          rid = os.environ.get("GITHUB_RUN_ID", "")
          lines.append(f"- run_artifact: `daily-ohlc-store-{rid}`")
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Archive OHLC store to zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.archive_ohlc_store

      # compute は別ランナー。Run 内の入力は GitHub artifact 正系 + R2 shadow 検証。
      - name: Upload OHLC store zip for compute job
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: daily-ohlc-store-${{ github.run_id }}
          path: data/cache/ohlc_store_archive/ohlc_store.zip
          retention-days: 3
          if-no-files-found: error

      - name: Upload stale exclusions artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stale-exclusions-${{ github.run_id }}
          path: data/cache/yf_daily/_stale_exclusions.json
          retention-days: 3
          if-no-files-found: ignore

      - name: R2 shadow put OHLC store staging
        id: r2_put_ohlc_store
        if: success()
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          OUT=$(python scripts/storage/artifact_bus_cli.py put \
            --entry-id artifact-daily-ohlc-store \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --source-name "daily-ohlc-store-$GITHUB_RUN_ID" \
            --local-path data/cache/ohlc_store_archive/ohlc_store.zip)
          MANIFEST_KEY=$(echo "$OUT" | python -c "import json,sys; print(json.load(sys.stdin)['manifest_logical_key'])")
          echo "manifest_logical_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"

      - name: R2 shadow put stale exclusions staging
        id: r2_put_stale_exclusions
        if: always()
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          OUT=$(python scripts/storage/artifact_bus_cli.py put \
            --entry-id artifact-stale-exclusions \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --source-name "stale-exclusions-$GITHUB_RUN_ID" \
            --local-path data/cache/yf_daily/_stale_exclusions.json)
          STATUS=$(echo "$OUT" | python -c "import json,sys; print(json.load(sys.stdin).get('status',''))")
          if [ "$STATUS" = "ok" ]; then
            MANIFEST_KEY=$(echo "$OUT" | python -c "import json,sys; print(json.load(sys.stdin)['manifest_logical_key'])")
            echo "manifest_logical_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Write R2 shadow validation summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## ensure_core_cache R2 shadow validation"
            python - <<'PY'
          import json
          from pathlib import Path

          shadow_dir = Path("/tmp/r2_shadow/ensure_core_cache")
          validated = 0
          skipped = []
          for path in sorted(shadow_dir.glob("*.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              status = payload.get("status")
              entry_id = payload.get("entry_id", path.stem)
              if status == "ok":
                  validated += int(payload.get("validated_count", 0) or 0)
                  print(f"- {entry_id}: ok sha256=`{payload.get('sha256', '')}`")
              elif status == "skipped_optional_missing":
                  skipped.append(entry_id)
                  print(f"- {entry_id}: skipped_optional")
              else:
                  print(f"- {entry_id}: {status}")
          print(f"- validated_count: `{validated}`")
          if skipped:
              print(f"- optional_skipped: `{', '.join(skipped)}`")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete warm OHLC cache key (avoid save race)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m stockradar.jobs.cache_ops rotate-delete \
            --repo "${{ github.repository }}" \
            --key ohlc-store-zip-v2 \
            --is-replay "${{ needs.resolve_trading_day.outputs.is_replay }}"

      - name: Save OHLC store zip (sole OHLC cache writer in this workflow)
        uses: actions/cache/save@v4
        if: success() && needs.resolve_trading_day.outputs.is_replay != 'true'
        with:
          path: data/cache/ohlc_store_archive/ohlc_store.zip
          key: ohlc-store-zip-v2

  compute_indicators:
    needs: [resolve_trading_day, resolve_core_csv, ensure_index_cache, ensure_core_cache]
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    outputs:
      daily_indicators_manifest_key: ${{ steps.r2_put_indicators.outputs.manifest_logical_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download OHLC store from ensure_core_cache
        uses: actions/download-artifact@v4
        with:
          name: daily-ohlc-store-${{ github.run_id }}
          path: data/cache/ohlc_store_archive/

      - name: Download stale exclusions artifact (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: stale-exclusions-${{ github.run_id }}
          path: data/cache/yf_daily/

      - name: Download index store artifact from ensure_index_cache
        uses: actions/download-artifact@v4
        with:
          name: daily-index-store-${{ github.run_id }}
          path: data/cache/index_store_archive/

      - name: Restore index store from zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.restore_index_store

      - name: Restore OHLC store from zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.restore_ohlc_store

      - name: Download resolved core CSV artifact
        uses: actions/download-artifact@v4
        with:
          name: daily-core-csv-${{ github.run_id }}
          path: data/universe/jpx/core_selected_staging/

      - name: Download core quality metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: daily-core-quality-${{ github.run_id }}
          path: data/universe/jpx/core_selected_staging/

      - name: R2 shadow validate OHLC store staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2_shadow/compute_indicators
          python scripts/storage/artifact_bus_cli.py shadow-validate \
            --entry-id artifact-daily-ohlc-store \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path data/cache/ohlc_store_archive/ohlc_store.zip \
            --json-output /tmp/r2_shadow/compute_indicators/ohlc_store.json

      - name: R2 shadow validate stale exclusions staging (optional)
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          python scripts/storage/artifact_bus_cli.py shadow-validate \
            --entry-id artifact-stale-exclusions \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path data/cache/yf_daily/_stale_exclusions.json \
            --json-output /tmp/r2_shadow/compute_indicators/stale_exclusions.json

      - name: R2 shadow validate index store staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          python scripts/storage/artifact_bus_cli.py shadow-validate \
            --entry-id artifact-daily-index-store \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path data/cache/index_store_archive/index_store.zip \
            --json-output /tmp/r2_shadow/compute_indicators/index_store.json

      - name: R2 shadow validate core CSV staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          python scripts/storage/artifact_bus_cli.py shadow-validate \
            --entry-id artifact-daily-core-csv \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path data/universe/jpx/core_selected_staging/equity_domestic_core_with_name.csv \
            --json-output /tmp/r2_shadow/compute_indicators/core_csv.json

      - name: R2 shadow validate core quality staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          python scripts/storage/artifact_bus_cli.py shadow-validate \
            --entry-id artifact-daily-core-quality \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path data/universe/jpx/core_selected_staging/core_selection.json \
            --json-output /tmp/r2_shadow/compute_indicators/core_quality.json

      - name: Compute indicators
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '31,63,126,252' }}
          RS_BENCHMARK: ${{ secrets.RS_BENCHMARK || 'BOTH' }}
        run: |
          set -euo pipefail
          RUN_DATE="${{ needs.resolve_trading_day.outputs.run_date }}"
          CORE_CSV="data/universe/jpx/core_selected_staging/equity_domestic_core_with_name.csv"
          if [ ! -f "$CORE_CSV" ]; then
            echo "error: core csv artifact not found at $CORE_CSV"
            exit 1
          fi
          python -m stockradar.jobs.compute_indicators_for_core --input "$CORE_CSV" --run-date "$RUN_DATE"

      - name: Write compute_indicators summary
        if: always()
        env:
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          run_date = os.environ.get("RUN_DATE", "")
          exclusions = Path("data/cache/yf_daily/_stale_exclusions.json")
          quality = Path("data/universe/jpx/core_selected_staging/core_selection.json")
          lines = ["## compute_indicators summary", f"- run_date: `{run_date}`"]
          if quality.exists():
            q = json.loads(quality.read_text(encoding="utf-8"))
            lines.append(f"- core_source: `{q.get('core_source')}`")
            lines.append(f"- delisted_patch_applied: `{q.get('delisted_patch_applied')}`")
            lines.append(f"- quality_tier: `{q.get('quality_tier')}`")
            lines.append(f"- selected_cache_key: `{q.get('selected_cache_key')}`")
          else:
            lines.append("- core_selection.json: `not found`")
          if exclusions.exists():
            payload = json.loads(exclusions.read_text(encoding="utf-8"))
            file_run_date = str(payload.get("run_date") or "")
            stale_count = int(payload.get("stale_count", 0) or 0)
            codes = payload.get("stale_codes") or []
            applicable = file_run_date == run_date
            lines.append(f"- stale_exclusions_file_run_date: `{file_run_date or '-'}'")
            lines.append(f"- stale_exclusions_applicable: `{applicable}`")
            lines.append(f"- excluded_by_stale_policy_expected: `{stale_count if applicable else 0}`")
            preview = ", ".join(str(c) for c in codes[:20])
            if len(codes) > 20:
              preview += ", ..."
            lines.append(f"- stale_codes_preview: `{preview or '-'}`")
          else:
            lines.append("- stale exclusions file: `not found`")
          lines.append("- performance_contract: `processed/workers/elapsed_sec logged by job`")
          with summary_path.open("a", encoding="utf-8") as f:
            f.write("\n".join(lines) + "\n")
          PY

      - name: Resolve indicators csv path
        id: indicators_csv
        env:
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          set -euo pipefail
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          echo "path=data/indicators/daily/indicators_${RUN_DATE_COMPACT}.csv" >> "$GITHUB_OUTPUT"

      - name: Upload indicators artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: daily-indicators-${{ needs.resolve_trading_day.outputs.run_date }}
          path: ${{ steps.indicators_csv.outputs.path }}
          retention-days: 7
          if-no-files-found: error

      - name: R2 shadow put indicators staging
        id: r2_put_indicators
        if: success()
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          INDICATORS_PATH="${{ steps.indicators_csv.outputs.path }}"
          if [ ! -f "$INDICATORS_PATH" ]; then
            echo "error: expected indicators file missing: $INDICATORS_PATH"
            exit 1
          fi
          OUT=$(python scripts/storage/artifact_bus_cli.py put \
            --entry-id artifact-daily-indicators \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --source-name "daily-indicators-$RUN_DATE" \
            --local-path "$INDICATORS_PATH")
          MANIFEST_KEY=$(echo "$OUT" | python -c "import json,sys; print(json.load(sys.stdin)['manifest_logical_key'])")
          echo "manifest_logical_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"

      - name: Write R2 shadow validation summary
        if: always()
        env:
          DAILY_INDICATORS_MANIFEST_KEY: ${{ steps.r2_put_indicators.outputs.manifest_logical_key }}
        run: |
          set -euo pipefail
          {
            echo "## compute_indicators R2 shadow validation"
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          shadow_dir = Path("/tmp/r2_shadow/compute_indicators")
          validated = 0
          skipped = []
          for path in sorted(shadow_dir.glob("*.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              status = payload.get("status")
              entry_id = payload.get("entry_id", path.stem)
              if status == "ok":
                  validated += int(payload.get("validated_count", 0) or 0)
                  print(f"- {entry_id}: ok sha256=`{payload.get('sha256', '')}`")
              elif status == "skipped_optional_missing":
                  skipped.append(entry_id)
                  reason = payload.get("degraded_reason") or payload.get("reason") or ""
                  print(f"- {entry_id}: skipped_optional ({reason})")
              else:
                  print(f"- {entry_id}: {status}")
          print(f"- validated_count: `{validated}`")
          manifest_key = os.environ.get("DAILY_INDICATORS_MANIFEST_KEY", "")
          if manifest_key:
              print(f"- daily_indicators_manifest_key: `{manifest_key}`")
          if validated == 0:
              raise SystemExit("error: required R2 shadow validation count is 0")
          if skipped:
              print(f"- optional_skipped: `{', '.join(skipped)}`")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

  event_cause_enrichment:
    uses: ./.github/workflows/daily_event_cause_enrichment.yml
    needs: [resolve_trading_day, compute_indicators]
    if: |
      needs.resolve_trading_day.outputs.is_open == 'True' &&
      needs.compute_indicators.result == 'success'
    with:
      run_date: ${{ needs.resolve_trading_day.outputs.run_date }}
    secrets: inherit

  render_and_upload:
    needs: [resolve_trading_day, compute_indicators, event_cause_enrichment]
    if: |
      always() &&
      needs.resolve_trading_day.outputs.is_open == 'True' &&
      needs.compute_indicators.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_publish != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download indicators artifact
        uses: actions/download-artifact@v4
        with:
          name: daily-indicators-${{ needs.resolve_trading_day.outputs.run_date }}
          path: data/indicators/daily/

      - name: Download enriched CSV artifact (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: enriched-csv-${{ needs.resolve_trading_day.outputs.run_date }}
          path: data/indicators/daily/

      - name: R2 shadow validate indicators staging
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2_shadow/render_and_upload
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          python scripts/storage/artifact_bus_cli.py shadow-validate \
            --entry-id artifact-daily-indicators \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path "data/indicators/daily/indicators_${RUN_DATE_COMPACT}.csv" \
            --json-output /tmp/r2_shadow/render_and_upload/indicators.json

      - name: R2 shadow validate enriched CSV staging (optional)
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          python scripts/storage/artifact_bus_cli.py shadow-validate \
            --entry-id artifact-enriched-csv \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path "data/indicators/daily/indicators_event_enriched_${RUN_DATE_COMPACT}.csv" \
            --json-output /tmp/r2_shadow/render_and_upload/enriched_csv.json

      - name: Select CSV and render XLSX
        id: render
        env:
          PYTHONPATH: .
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          set -euo pipefail
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          ENRICHED="data/indicators/daily/indicators_event_enriched_${RUN_DATE_COMPACT}.csv"
          BASE="data/indicators/daily/indicators_${RUN_DATE_COMPACT}.csv"
          if [ -f "$ENRICHED" ]; then
            CSV_PATH="$ENRICHED"
            echo "Using enriched CSV"
          else
            CSV_PATH="$BASE"
            echo "Using base indicators CSV"
          fi
          if [ ! -f "$CSV_PATH" ]; then
            echo "エラー: CSV が見つかりません: $CSV_PATH"
            exit 1
          fi
          OUT=$(python scripts/render_sheet/render_sheet.py --input-csv "$CSV_PATH" --config config/render_sheet.yaml 2>&1)
          echo "$OUT"
          XLSX_PATH=$(echo "$OUT" | grep "^output_xlsx=" | cut -d= -f2-)
          if [ -z "$XLSX_PATH" ] || [ ! -f "$XLSX_PATH" ]; then
            XLSX_PATH="data/indicators/daily/${RUN_DATE}_Daily.xlsx"
          fi
          if [ ! -f "$XLSX_PATH" ]; then
            echo "エラー: XLSX が生成されませんでした: $XLSX_PATH"
            exit 1
          fi
          echo "csv_path=$CSV_PATH" >> "$GITHUB_OUTPUT"
          echo "xlsx_path=$XLSX_PATH" >> "$GITHUB_OUTPUT"

      - name: Write R2 shadow validation summary
        if: always()
        env:
          ENRICHED_MANIFEST_KEY: ${{ needs.event_cause_enrichment.outputs.enriched_manifest_key }}
        run: |
          set -euo pipefail
          {
            echo "## render_and_upload R2 shadow validation"
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          shadow_dir = Path("/tmp/r2_shadow/render_and_upload")
          validated = 0
          skipped = []
          for path in sorted(shadow_dir.glob("*.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              status = payload.get("status")
              entry_id = payload.get("entry_id", path.stem)
              if status == "ok":
                  validated += int(payload.get("validated_count", 0) or 0)
                  print(f"- {entry_id}: ok sha256=`{payload.get('sha256', '')}`")
              elif status == "skipped_optional_missing":
                  skipped.append(entry_id)
                  reason = payload.get("degraded_reason") or payload.get("reason") or ""
                  print(f"- {entry_id}: skipped_optional ({reason})")
              else:
                  print(f"- {entry_id}: {status}")
          print(f"- validated_count: `{validated}`")
          enriched_key = os.environ.get("ENRICHED_MANIFEST_KEY", "")
          if enriched_key:
              print(f"- enriched_manifest_key: `{enriched_key}`")
          else:
              print("- enriched_manifest_key: `(optional missing)`")
          if validated == 0:
              raise SystemExit("error: required R2 shadow validation count is 0")
          if skipped:
              print(f"- optional_skipped: `{', '.join(skipped)}`")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to all targets (R2 / Dropbox / GitHub Release; Drive optional)
        env:
          PYTHONPATH: .
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_BASE_FOLDER: ${{ secrets.DROPBOX_BASE_FOLDER }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CSV_PATH="${{ steps.render.outputs.csv_path }}"
          XLSX_PATH="${{ steps.render.outputs.xlsx_path }}"
          TARGETS="r2,dropbox,github"
          if [ -n "$GDRIVE_OAUTH_CLIENT_ID" ] && [ -n "$GDRIVE_OAUTH_REFRESH_TOKEN" ]; then
            TARGETS="drive,r2,dropbox,github"
          fi
          python scripts/upload_to_all_targets.py --run-date "$RUN_DATE" --targets "$TARGETS" --files "$CSV_PATH" "$XLSX_PATH"
