name: Daily Indicators

on:
  workflow_dispatch:  # 手動実行
  schedule:
    # 毎営業日 15:37 JST（UTC 06:37）
    # 注: GitHub ActionsのcronはUTC基準
    - cron: "37 6 * * 1-5"  # 月曜〜金曜 06:37 UTC（日本時間 15:37）

concurrency:
  group: daily-indicators
  cancel-in-progress: false  # 同一workflowの多重起動禁止（前回をキャンセルしない）

permissions:
  contents: write

jobs:
  resolve_trading_day:
    runs-on: ubuntu-latest
    outputs:
      run_date: ${{ steps.resolve.outputs.run_date }}
      is_open: ${{ steps.resolve.outputs.is_open }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve trading day
        id: resolve
        env:
          PYTHONPATH: src
        run: |
          OUTPUT=$(python -m stockradar.jobs.resolve_trading_day)
          RUN_DATE=$(echo "$OUTPUT" | grep "^run_date=" | cut -d= -f2)
          IS_OPEN=$(echo "$OUTPUT" | grep "^is_open=" | cut -d= -f2)
          echo "run_date=$RUN_DATE" >> $GITHUB_OUTPUT
          echo "is_open=$IS_OPEN" >> $GITHUB_OUTPUT
          echo "Resolved: run_date=$RUN_DATE, is_open=$IS_OPEN"

  ensure_index_cache:
    needs: resolve_trading_day
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache index data
        uses: actions/cache@v4
        with:
          path: data/cache/yf_index/
          key: yf-index-${{ github.run_number }}
          restore-keys: |
            yf-index-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure index cache
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '31,63,126,252' }}
          BUFFER_DAYS: ${{ secrets.BUFFER_DAYS || '20' }}
        run: |
          python -m stockradar.jobs.ensure_index_cache --run-date ${{ needs.resolve_trading_day.outputs.run_date }}

  ensure_core_cache:
    needs: [resolve_trading_day]
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache OHLC store zip
        uses: actions/cache@v4
        with:
          path: data/cache/ohlc_store_archive/ohlc_store.zip
          key: ohlc-store-zip-v2
          restore-keys: |
            ohlc-store-zip-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore OHLC store from zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.restore_ohlc_store

      - name: Restore patched universe cache
        uses: actions/cache@v4
        with:
          path: data/universe/jpx/patched_cache
          key: universe-patched-${{ needs.resolve_trading_day.outputs.run_date }}

      - name: Download monthly release and resolve core CSV
        id: download_core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          LATEST_RELEASE=$(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("monthly-")) | .tagName' | head -1)
          if [ -z "$LATEST_RELEASE" ]; then
            echo "エラー: 月次Release（monthly-*）が見つかりません"
            exit 1
          fi
          echo "Latest monthly release: $LATEST_RELEASE"
          mkdir -p data/universe/jpx/latest_release
          if ! gh release download "$LATEST_RELEASE" \
            --pattern "equity_domestic_core_with_name.csv" \
            --dir "data/universe/jpx/latest_release" \
            --repo "${{ github.repository }}"; then
            echo "エラー: Releaseからのダウンロードに失敗しました: $LATEST_RELEASE"
            gh release view "$LATEST_RELEASE" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' || true
            exit 1
          fi
          RELEASE_DATE="${LATEST_RELEASE#monthly-}"
          RELEASE_DATE="${RELEASE_DATE:0:4}-${RELEASE_DATE:4:2}-${RELEASE_DATE:6:2}"
          mkdir -p data/universe/jpx/patched_cache
          USE_PATCHED_CACHE=false
          if [ -f data/universe/jpx/patched_cache/manifest.json ] && [ -f data/universe/jpx/patched_cache/equity_domestic_core_with_name.csv ]; then
            BASE_DATE=$(jq -r .base_release_date data/universe/jpx/patched_cache/manifest.json)
            if [ "$BASE_DATE" = "$RELEASE_DATE" ] && [ "$BASE_DATE" != "null" ]; then
              USE_PATCHED_CACHE=true
              echo "Using patched cache (base_release_date=$BASE_DATE)"
            fi
          fi
          if [ "$USE_PATCHED_CACHE" != "true" ]; then
            echo "Applying delisted patch to monthly release"
            python -m stockradar.jobs.patch_universe_daily \
              --input data/universe/jpx/latest_release/equity_domestic_core_with_name.csv \
              --run-date "$RUN_DATE" \
              --base-release "$LATEST_RELEASE"
          fi
          echo "core_csv=data/universe/jpx/patched_cache/equity_domestic_core_with_name.csv" >> $GITHUB_OUTPUT

      - name: Ensure core cache
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '31,63,126,252' }}
          BUFFER_DAYS: ${{ secrets.BUFFER_DAYS || '20' }}
          YF_BATCH_SIZE: ${{ secrets.YF_BATCH_SIZE || '100' }}
          YF_SLEEP_SEC_BETWEEN_BATCHES: ${{ secrets.YF_SLEEP_SEC_BETWEEN_BATCHES || '5' }}
          YF_RETRY_MAX: ${{ secrets.YF_RETRY_MAX || '3' }}
          YF_RETRY_BACKOFF_SEC: ${{ secrets.YF_RETRY_BACKOFF_SEC || '5,15,30' }}
        run: |
          python -m stockradar.jobs.ensure_core_cache --input "${{ steps.download_core.outputs.core_csv }}" --run-date ${{ needs.resolve_trading_day.outputs.run_date }}

      - name: Archive OHLC store to zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.archive_ohlc_store

      # compute_indicators は別ランナー。キャッシュの restore-keys だと過去 run の zip を引く取り違えがあり得るため、
      # 同一 workflow の ensure で出来上がった zip を artifact で明示受け渡しする。
      - name: Upload OHLC store zip for compute job
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: daily-ohlc-store-${{ github.run_id }}
          path: data/cache/ohlc_store_archive/ohlc_store.zip
          retention-days: 3
          if-no-files-found: error

      - name: Cache OHLC store zip
        uses: actions/cache@v4
        if: success()
        with:
          path: data/cache/ohlc_store_archive/ohlc_store.zip
          key: ohlc-store-zip-v2

  compute_indicators:
    needs: [resolve_trading_day, ensure_index_cache, ensure_core_cache]
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download OHLC store from ensure_core_cache
        uses: actions/download-artifact@v4
        with:
          name: daily-ohlc-store-${{ github.run_id }}
          path: data/cache/ohlc_store_archive/

      - name: Cache index data
        uses: actions/cache@v4
        with:
          path: data/cache/yf_index/
          key: yf-index-${{ github.run_number }}
          restore-keys: |
            yf-index-

      - name: Restore OHLC store from zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.restore_ohlc_store

      - name: Restore patched universe cache
        uses: actions/cache@v4
        with:
          path: data/universe/jpx/patched_cache
          key: universe-patched-${{ needs.resolve_trading_day.outputs.run_date }}

      - name: Download monthly release and resolve core CSV
        id: download_core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          LATEST_RELEASE=$(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("monthly-")) | .tagName' | head -1)
          if [ -z "$LATEST_RELEASE" ]; then
            echo "エラー: 月次Release（monthly-*）が見つかりません"
            exit 1
          fi
          echo "Latest monthly release: $LATEST_RELEASE"
          mkdir -p data/universe/jpx/latest_release
          if ! gh release download "$LATEST_RELEASE" \
            --pattern "equity_domestic_core_with_name.csv" \
            --dir "data/universe/jpx/latest_release" \
            --repo "${{ github.repository }}"; then
            echo "エラー: Releaseからのダウンロードに失敗しました: $LATEST_RELEASE"
            gh release view "$LATEST_RELEASE" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' || true
            exit 1
          fi
          RELEASE_DATE="${LATEST_RELEASE#monthly-}"
          RELEASE_DATE="${RELEASE_DATE:0:4}-${RELEASE_DATE:4:2}-${RELEASE_DATE:6:2}"
          mkdir -p data/universe/jpx/patched_cache
          USE_PATCHED_CACHE=false
          if [ -f data/universe/jpx/patched_cache/manifest.json ] && [ -f data/universe/jpx/patched_cache/equity_domestic_core_with_name.csv ]; then
            BASE_DATE=$(jq -r .base_release_date data/universe/jpx/patched_cache/manifest.json)
            if [ "$BASE_DATE" = "$RELEASE_DATE" ] && [ "$BASE_DATE" != "null" ]; then
              USE_PATCHED_CACHE=true
              echo "Using patched cache (base_release_date=$BASE_DATE)"
            fi
          fi
          if [ "$USE_PATCHED_CACHE" != "true" ]; then
            echo "Applying delisted patch to monthly release"
            python -m stockradar.jobs.patch_universe_daily \
              --input data/universe/jpx/latest_release/equity_domestic_core_with_name.csv \
              --run-date "$RUN_DATE" \
              --base-release "$LATEST_RELEASE"
          fi
          echo "core_csv=data/universe/jpx/patched_cache/equity_domestic_core_with_name.csv" >> $GITHUB_OUTPUT

      - name: Compute indicators
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '31,63,126,252' }}
          RS_BENCHMARK: ${{ secrets.RS_BENCHMARK || 'BOTH' }}
        run: |
          python -m stockradar.jobs.compute_indicators_for_core --input "${{ steps.download_core.outputs.core_csv }}" --run-date ${{ needs.resolve_trading_day.outputs.run_date }}

      - name: Upload indicators artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: daily-indicators-${{ needs.resolve_trading_day.outputs.run_date }}
          path: data/indicators/daily/indicators_*.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Archive OHLC store to zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.archive_ohlc_store

      - name: Cache OHLC store zip
        uses: actions/cache@v4
        if: success()
        with:
          path: data/cache/ohlc_store_archive/ohlc_store.zip
          key: ohlc-store-zip-v2

  event_cause_enrichment:
    uses: ./.github/workflows/daily_event_cause_enrichment.yml
    needs: [resolve_trading_day, compute_indicators]
    if: |
      needs.resolve_trading_day.outputs.is_open == 'True' &&
      needs.compute_indicators.result == 'success'
    with:
      run_date: ${{ needs.resolve_trading_day.outputs.run_date }}
    secrets: inherit

  render_and_upload:
    needs: [resolve_trading_day, compute_indicators, event_cause_enrichment]
    if: |
      always() &&
      needs.resolve_trading_day.outputs.is_open == 'True' &&
      needs.compute_indicators.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3

      - name: Download indicators artifact
        uses: actions/download-artifact@v4
        with:
          name: daily-indicators-${{ needs.resolve_trading_day.outputs.run_date }}
          path: data/indicators/daily/

      - name: Download enriched CSV artifact (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: enriched-csv-${{ needs.resolve_trading_day.outputs.run_date }}
          path: data/indicators/daily/

      - name: Select CSV and render XLSX
        id: render
        env:
          PYTHONPATH: .
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          RUN_DATE="$RUN_DATE"
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          ENRICHED="data/indicators/daily/indicators_event_enriched_${RUN_DATE_COMPACT}.csv"
          BASE="data/indicators/daily/indicators_${RUN_DATE_COMPACT}.csv"
          if [ -f "$ENRICHED" ]; then
            CSV_PATH="$ENRICHED"
            echo "Using enriched CSV"
          else
            CSV_PATH="$BASE"
            echo "Using base indicators CSV"
          fi
          if [ ! -f "$CSV_PATH" ]; then
            echo "エラー: CSV が見つかりません: $CSV_PATH"
            exit 1
          fi
          OUT=$(python scripts/render_sheet/render_sheet.py --input-csv "$CSV_PATH" --config config/render_sheet.yaml 2>&1)
          echo "$OUT"
          XLSX_PATH=$(echo "$OUT" | grep "^output_xlsx=" | cut -d= -f2-)
          if [ -z "$XLSX_PATH" ] || [ ! -f "$XLSX_PATH" ]; then
            XLSX_PATH="data/indicators/daily/${RUN_DATE}_Daily.xlsx"
          fi
          if [ ! -f "$XLSX_PATH" ]; then
            echo "エラー: XLSX が生成されませんでした: $XLSX_PATH"
            exit 1
          fi
          echo "csv_path=$CSV_PATH" >> "$GITHUB_OUTPUT"
          echo "xlsx_path=$XLSX_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to all targets (R2 / Dropbox / GitHub Release; Drive optional)
        env:
          PYTHONPATH: .
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_BASE_FOLDER: ${{ secrets.DROPBOX_BASE_FOLDER }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_DATE="$RUN_DATE"
          CSV_PATH="${{ steps.render.outputs.csv_path }}"
          XLSX_PATH="${{ steps.render.outputs.xlsx_path }}"
          TARGETS="r2,dropbox,github"
          if [ -n "$GDRIVE_OAUTH_CLIENT_ID" ] && [ -n "$GDRIVE_OAUTH_REFRESH_TOKEN" ]; then
            TARGETS="drive,r2,dropbox,github"
          fi
          python scripts/upload_to_all_targets.py --run-date "$RUN_DATE" --targets "$TARGETS" --files "$CSV_PATH" "$XLSX_PATH"

  archive_ohlc_store:
    needs: [resolve_trading_day, compute_indicators]
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache OHLC store zip
        uses: actions/cache@v4
        with:
          path: data/cache/ohlc_store_archive/ohlc_store.zip
          key: ohlc-store-zip-v2
          restore-keys: |
            ohlc-store-zip-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore OHLC store from zip
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.restore_ohlc_store

      - name: Archive OHLC store
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.archive_ohlc_store

      - name: Cache OHLC store zip
        uses: actions/cache@v4
        if: success()
        with:
          path: data/cache/ohlc_store_archive/ohlc_store.zip
          key: ohlc-store-zip-v2

      - name: Upload OHLC zip backup artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ohlc-store-zip-${{ needs.resolve_trading_day.outputs.run_date }}
          path: data/cache/ohlc_store_archive/ohlc_store.zip
          retention-days: 7
          if-no-files-found: error
