name: Daily Indicators

on:
  workflow_dispatch:  # 手動実行
  schedule:
    # 毎営業日 16:00 JST 以降（UTC 07:00）
    # 注: GitHub ActionsのcronはUTC基準
    - cron: "0 7 * * 1-5"  # 月曜〜金曜 07:00 UTC（日本時間 16:00）

concurrency:
  group: daily-indicators
  cancel-in-progress: false  # 同一workflowの多重起動禁止（前回をキャンセルしない）

jobs:
  resolve_trading_day:
    runs-on: ubuntu-latest
    outputs:
      run_date: ${{ steps.resolve.outputs.run_date }}
      is_open: ${{ steps.resolve.outputs.is_open }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve trading day
        id: resolve
        env:
          PYTHONPATH: src
        run: |
          OUTPUT=$(python -m stockradar.jobs.resolve_trading_day)
          RUN_DATE=$(echo "$OUTPUT" | grep "^run_date=" | cut -d= -f2)
          IS_OPEN=$(echo "$OUTPUT" | grep "^is_open=" | cut -d= -f2)
          echo "run_date=$RUN_DATE" >> $GITHUB_OUTPUT
          echo "is_open=$IS_OPEN" >> $GITHUB_OUTPUT
          echo "Resolved: run_date=$RUN_DATE, is_open=$IS_OPEN"

  ensure_index_cache:
    needs: resolve_trading_day
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache index data
        uses: actions/cache@v4
        with:
          path: data/cache/yf_index/
          key: yf-index-cache-${{ github.run_id }}
          restore-keys: |
            yf-index-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure index cache
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '63,126,252' }}
          BUFFER_DAYS: ${{ secrets.BUFFER_DAYS || '20' }}
        run: |
          python -m stockradar.jobs.ensure_index_cache --run-date ${{ needs.resolve_trading_day.outputs.run_date }}

  ensure_core_cache:
    needs: resolve_trading_day
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache daily data
        uses: actions/cache@v4
        with:
          path: data/cache/yf_daily/
          key: yf-daily-cache-${{ github.run_id }}
          restore-keys: |
            yf-daily-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find latest core CSV
        id: find_core
        run: |
          LATEST=$(find data/universe/jpx -name "equity_domestic_core_with_name.csv" -type f | sort | tail -1)
          if [ -z "$LATEST" ]; then
            echo "エラー: equity_domestic_core_with_name.csv が見つかりません"
            exit 1
          fi
          echo "core_csv=$LATEST" >> $GITHUB_OUTPUT
          echo "Found: $LATEST"

      - name: Ensure core cache
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '63,126,252' }}
          BUFFER_DAYS: ${{ secrets.BUFFER_DAYS || '20' }}
          YF_BATCH_SIZE: ${{ secrets.YF_BATCH_SIZE || '100' }}
          YF_SLEEP_SEC_BETWEEN_BATCHES: ${{ secrets.YF_SLEEP_SEC_BETWEEN_BATCHES || '5' }}
          YF_RETRY_MAX: ${{ secrets.YF_RETRY_MAX || '3' }}
          YF_RETRY_BACKOFF_SEC: ${{ secrets.YF_RETRY_BACKOFF_SEC || '5,15,30' }}
        run: |
          python -m stockradar.jobs.ensure_core_cache --input "${{ steps.find_core.outputs.core_csv }}" --run-date ${{ needs.resolve_trading_day.outputs.run_date }}

  compute_indicators:
    needs: [resolve_trading_day, ensure_index_cache, ensure_core_cache]
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache daily data
        uses: actions/cache@v4
        with:
          path: data/cache/yf_daily/
          key: yf-daily-cache-${{ github.run_id }}
          restore-keys: |
            yf-daily-cache-

      - name: Cache index data
        uses: actions/cache@v4
        with:
          path: data/cache/yf_index/
          key: yf-index-cache-${{ github.run_id }}
          restore-keys: |
            yf-index-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find latest core CSV
        id: find_core
        run: |
          LATEST=$(find data/universe/jpx -name "equity_domestic_core_with_name.csv" -type f | sort | tail -1)
          if [ -z "$LATEST" ]; then
            echo "エラー: equity_domestic_core_with_name.csv が見つかりません"
            exit 1
          fi
          echo "core_csv=$LATEST" >> $GITHUB_OUTPUT
          echo "Found: $LATEST"

      - name: Compute indicators
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '63,126,252' }}
          RS_BENCHMARK: ${{ secrets.RS_BENCHMARK || 'BOTH' }}
        run: |
          python -m stockradar.jobs.compute_indicators_for_core --input "${{ steps.find_core.outputs.core_csv }}" --run-date ${{ needs.resolve_trading_day.outputs.run_date }}

      - name: Upload indicators artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: daily-indicators-${{ needs.resolve_trading_day.outputs.run_date }}
          path: data/indicators/daily/indicators_*.csv
          retention-days: 90
          if-no-files-found: warn
