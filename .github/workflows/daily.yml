name: Daily Indicators

on:
  workflow_dispatch:  # 手動実行
  schedule:
    # 毎営業日 15:37 JST（UTC 06:37）
    # 注: GitHub ActionsのcronはUTC基準
    - cron: "37 6 * * 1-5"  # 月曜〜金曜 06:37 UTC（日本時間 15:37）

concurrency:
  group: daily-indicators
  cancel-in-progress: false  # 同一workflowの多重起動禁止（前回をキャンセルしない）

jobs:
  resolve_trading_day:
    runs-on: ubuntu-latest
    outputs:
      run_date: ${{ steps.resolve.outputs.run_date }}
      is_open: ${{ steps.resolve.outputs.is_open }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve trading day
        id: resolve
        env:
          PYTHONPATH: src
        run: |
          OUTPUT=$(python -m stockradar.jobs.resolve_trading_day)
          RUN_DATE=$(echo "$OUTPUT" | grep "^run_date=" | cut -d= -f2)
          IS_OPEN=$(echo "$OUTPUT" | grep "^is_open=" | cut -d= -f2)
          echo "run_date=$RUN_DATE" >> $GITHUB_OUTPUT
          echo "is_open=$IS_OPEN" >> $GITHUB_OUTPUT
          echo "Resolved: run_date=$RUN_DATE, is_open=$IS_OPEN"

  restore_ohlc_store:
    needs: resolve_trading_day
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache OHLC store zip
        uses: actions/cache@v4
        with:
          path: data/cache/ohlc_store_archive/ohlc_store.zip
          key: ohlc-store-zip-v1
          restore-keys: |
            ohlc-store-zip-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore OHLC store
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.restore_ohlc_store

      - name: Upload OHLC store for next jobs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ohlc-store-restored
          path: data/cache/yf_daily/
          retention-days: 1
          if-no-files-found: ignore

  ensure_index_cache:
    needs: resolve_trading_day
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache index data
        uses: actions/cache@v4
        with:
          path: data/cache/yf_index/
          key: yf-index-cache-${{ github.run_id }}
          restore-keys: |
            yf-index-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure index cache
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '31,63,126,252' }}
          BUFFER_DAYS: ${{ secrets.BUFFER_DAYS || '20' }}
        run: |
          python -m stockradar.jobs.ensure_index_cache --run-date ${{ needs.resolve_trading_day.outputs.run_date }}

  ensure_core_cache:
    needs: [resolve_trading_day, restore_ohlc_store]
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download OHLC store from previous job
        uses: actions/download-artifact@v4
        with:
          name: ohlc-store-restored
          path: data/cache/yf_daily/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore patched universe cache
        uses: actions/cache@v4
        with:
          path: data/universe/jpx/patched_cache
          key: universe-patched-${{ needs.resolve_trading_day.outputs.run_date }}

      - name: Download monthly release and resolve core CSV
        id: download_core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          LATEST_RELEASE=$(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("monthly-")) | .tagName' | head -1)
          if [ -z "$LATEST_RELEASE" ]; then
            echo "エラー: 月次Release（monthly-*）が見つかりません"
            exit 1
          fi
          echo "Latest monthly release: $LATEST_RELEASE"
          mkdir -p data/universe/jpx/latest_release
          if ! gh release download "$LATEST_RELEASE" \
            --pattern "equity_domestic_core_with_name.csv" \
            --dir "data/universe/jpx/latest_release" \
            --repo "${{ github.repository }}"; then
            echo "エラー: Releaseからのダウンロードに失敗しました: $LATEST_RELEASE"
            gh release view "$LATEST_RELEASE" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' || true
            exit 1
          fi
          RELEASE_DATE="${LATEST_RELEASE#monthly-}"
          RELEASE_DATE="${RELEASE_DATE:0:4}-${RELEASE_DATE:4:2}-${RELEASE_DATE:6:2}"
          mkdir -p data/universe/jpx/patched_cache
          USE_PATCHED_CACHE=false
          if [ -f data/universe/jpx/patched_cache/manifest.json ] && [ -f data/universe/jpx/patched_cache/equity_domestic_core_with_name.csv ]; then
            BASE_DATE=$(jq -r .base_release_date data/universe/jpx/patched_cache/manifest.json)
            if [ "$BASE_DATE" = "$RELEASE_DATE" ] && [ "$BASE_DATE" != "null" ]; then
              USE_PATCHED_CACHE=true
              echo "Using patched cache (base_release_date=$BASE_DATE)"
            fi
          fi
          if [ "$USE_PATCHED_CACHE" != "true" ]; then
            echo "Applying delisted patch to monthly release"
            python -m stockradar.jobs.patch_universe_daily \
              --input data/universe/jpx/latest_release/equity_domestic_core_with_name.csv \
              --run-date "$RUN_DATE" \
              --base-release "$LATEST_RELEASE"
          fi
          echo "core_csv=data/universe/jpx/patched_cache/equity_domestic_core_with_name.csv" >> $GITHUB_OUTPUT

      - name: Ensure core cache
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '31,63,126,252' }}
          BUFFER_DAYS: ${{ secrets.BUFFER_DAYS || '20' }}
          YF_BATCH_SIZE: ${{ secrets.YF_BATCH_SIZE || '100' }}
          YF_SLEEP_SEC_BETWEEN_BATCHES: ${{ secrets.YF_SLEEP_SEC_BETWEEN_BATCHES || '5' }}
          YF_RETRY_MAX: ${{ secrets.YF_RETRY_MAX || '3' }}
          YF_RETRY_BACKOFF_SEC: ${{ secrets.YF_RETRY_BACKOFF_SEC || '5,15,30' }}
        run: |
          python -m stockradar.jobs.ensure_core_cache --input "${{ steps.download_core.outputs.core_csv }}" --run-date ${{ needs.resolve_trading_day.outputs.run_date }}

      - name: Upload OHLC store for next jobs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ohlc-store-after-core-cache
          path: data/cache/yf_daily/
          retention-days: 1
          if-no-files-found: ignore

  compute_indicators:
    needs: [resolve_trading_day, ensure_index_cache, ensure_core_cache]
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    outputs:
      csv_file_id: ${{ steps.upload_csv.outputs.csv_file_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download OHLC store from previous job
        uses: actions/download-artifact@v4
        with:
          name: ohlc-store-after-core-cache
          path: data/cache/yf_daily/

      - name: Cache index data
        uses: actions/cache@v4
        with:
          path: data/cache/yf_index/
          key: yf-index-cache-${{ github.run_id }}
          restore-keys: |
            yf-index-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore patched universe cache
        uses: actions/cache@v4
        with:
          path: data/universe/jpx/patched_cache
          key: universe-patched-${{ needs.resolve_trading_day.outputs.run_date }}

      - name: Download monthly release and resolve core CSV
        id: download_core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
          RUN_DATE: ${{ needs.resolve_trading_day.outputs.run_date }}
        run: |
          LATEST_RELEASE=$(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("monthly-")) | .tagName' | head -1)
          if [ -z "$LATEST_RELEASE" ]; then
            echo "エラー: 月次Release（monthly-*）が見つかりません"
            exit 1
          fi
          echo "Latest monthly release: $LATEST_RELEASE"
          mkdir -p data/universe/jpx/latest_release
          if ! gh release download "$LATEST_RELEASE" \
            --pattern "equity_domestic_core_with_name.csv" \
            --dir "data/universe/jpx/latest_release" \
            --repo "${{ github.repository }}"; then
            echo "エラー: Releaseからのダウンロードに失敗しました: $LATEST_RELEASE"
            gh release view "$LATEST_RELEASE" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' || true
            exit 1
          fi
          RELEASE_DATE="${LATEST_RELEASE#monthly-}"
          RELEASE_DATE="${RELEASE_DATE:0:4}-${RELEASE_DATE:4:2}-${RELEASE_DATE:6:2}"
          mkdir -p data/universe/jpx/patched_cache
          USE_PATCHED_CACHE=false
          if [ -f data/universe/jpx/patched_cache/manifest.json ] && [ -f data/universe/jpx/patched_cache/equity_domestic_core_with_name.csv ]; then
            BASE_DATE=$(jq -r .base_release_date data/universe/jpx/patched_cache/manifest.json)
            if [ "$BASE_DATE" = "$RELEASE_DATE" ] && [ "$BASE_DATE" != "null" ]; then
              USE_PATCHED_CACHE=true
              echo "Using patched cache (base_release_date=$BASE_DATE)"
            fi
          fi
          if [ "$USE_PATCHED_CACHE" != "true" ]; then
            echo "Applying delisted patch to monthly release"
            python -m stockradar.jobs.patch_universe_daily \
              --input data/universe/jpx/latest_release/equity_domestic_core_with_name.csv \
              --run-date "$RUN_DATE" \
              --base-release "$LATEST_RELEASE"
          fi
          echo "core_csv=data/universe/jpx/patched_cache/equity_domestic_core_with_name.csv" >> $GITHUB_OUTPUT

      - name: Compute indicators
        env:
          PYTHONPATH: src
          Z_LOOKBACK_DAYS: ${{ secrets.Z_LOOKBACK_DAYS || '60' }}
          RS_WINDOWS: ${{ secrets.RS_WINDOWS || '31,63,126,252' }}
          RS_BENCHMARK: ${{ secrets.RS_BENCHMARK || 'BOTH' }}
        run: |
          python -m stockradar.jobs.compute_indicators_for_core --input "${{ steps.download_core.outputs.core_csv }}" --run-date ${{ needs.resolve_trading_day.outputs.run_date }}

      - name: Upload indicators artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: daily-indicators-${{ needs.resolve_trading_day.outputs.run_date }}
          path: data/indicators/daily/indicators_*.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Install Drive API deps (for 0011_work upload)
        if: success()
        run: pip install google-api-python-client google-auth

      - name: Upload indicator CSVs to 0011_work (day folder)
        id: upload_csv
        if: success()
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          RUN_DATE="${{ needs.resolve_trading_day.outputs.run_date }}"
          MONTH="${RUN_DATE:0:7}"
          shopt -s nullglob
          FILES=(data/indicators/daily/indicators_*.csv)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No indicator CSVs found, skipping Drive upload"
            exit 0
          fi
          OUTPUT=$(PYTHONPATH=. python scripts/gdrive/upload_to_work.py --month "$MONTH" --day "$RUN_DATE" "${FILES[@]}" 2>&1)
          echo "$OUTPUT"
          CSV_FILE_ID=$(echo "$OUTPUT" | grep "^csv_file_id=" | tail -1 | cut -d= -f2-)
          [ -n "$CSV_FILE_ID" ] && echo "csv_file_id=$CSV_FILE_ID" >> "$GITHUB_OUTPUT"
          echo "Uploaded ${#FILES[@]} CSV(s) to 0011_work/$MONTH/$RUN_DATE/"

      - name: Upload OHLC store for archiving
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ohlc-store-updated
          path: data/cache/yf_daily/
          retention-days: 1
          if-no-files-found: ignore

  render_sheet_report:
    needs: [resolve_trading_day, compute_indicators]
    if: |
      always() &&
      needs.resolve_trading_day.outputs.is_open == 'True' &&
      needs.compute_indicators.result == 'success' &&
      needs.compute_indicators.outputs.csv_file_id != ''
    uses: ./.github/workflows/render_sheet.yml
    with:
      csv_drive_file_id: ${{ needs.compute_indicators.outputs.csv_file_id }}
      output_folder_id: "1sUA-HL04eOo9fCBa5fN1OxKRs0Sp-Wf5"
      run_date: ${{ needs.resolve_trading_day.outputs.run_date }}
    secrets: inherit

  archive_ohlc_store:
    needs: [resolve_trading_day, compute_indicators]
    if: needs.resolve_trading_day.outputs.is_open == 'True'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download OHLC store from previous job
        uses: actions/download-artifact@v4
        with:
          name: ohlc-store-updated
          path: data/cache/yf_daily/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Archive OHLC store
        env:
          PYTHONPATH: src
        run: |
          python -m stockradar.jobs.archive_ohlc_store

      - name: Cache OHLC store zip
        uses: actions/cache@v4
        if: success()
        with:
          path: data/cache/ohlc_store_archive/ohlc_store.zip
          key: ohlc-store-zip-v1
