name: Daily Event Cause Enrichment

on:
  workflow_call:
    inputs:
      run_date:
        description: "対象日（YYYY-MM-DD）"
        required: true
        type: string
    outputs:
      enriched_csv_path:
        description: "ニュース列を付与したCSVのワークスペース相対パス"
        value: ${{ jobs.enrich.outputs.enriched_csv_path }}
      enriched_manifest_key:
        description: "enriched CSV run_artifact manifest logical key"
        value: ${{ jobs.enrich.outputs.enriched_manifest_key }}

env:
  TZ: Asia/Tokyo

jobs:
  enrich:
    runs-on: ubuntu-latest
    outputs:
      enriched_csv_path: ${{ steps.build_enriched.outputs.enriched_csv_path }}
      enriched_manifest_key: ${{ steps.r2_put_enriched.outputs.manifest_logical_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Contract: artifact name must stay aligned with daily.yml compute_indicators upload
      # (`daily-indicators-${run_date}`). Reusable shares github.run_id with caller for R2 keys.
      - name: R2 get indicators staging
        id: r2_get_indicators
        continue-on-error: true
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ inputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          mkdir -p /tmp/r2_handoff/enrich
          INDICATORS_PATH="data/indicators/daily/indicators_${RUN_DATE_COMPACT}.csv"
          mkdir -p data/indicators/daily
          set +e
          python scripts/storage/artifact_bus_cli.py get \
            --entry-id artifact-daily-indicators \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --local-path "$INDICATORS_PATH" \
            --json-output /tmp/r2_handoff/enrich/artifact-daily-indicators.json
          set -e
          FALLBACK=$(python -c "import json; print('true' if json.load(open('/tmp/r2_handoff/enrich/artifact-daily-indicators.json')).get('fallback_required') else 'false')")
          echo "fallback_required=$FALLBACK" >> "$GITHUB_OUTPUT"

      - name: GitHub fallback indicators artifact
        if: steps.r2_get_indicators.outputs.fallback_required == 'true'
        uses: actions/download-artifact@v4
        with:
          name: daily-indicators-${{ inputs.run_date }}
          path: data/indicators/daily/

      - name: Record GitHub fallback indicators
        if: steps.r2_get_indicators.outputs.fallback_required == 'true'
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ inputs.run_date }}
        run: |
          set -euo pipefail
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          python scripts/storage/artifact_bus_cli.py record-fallback \
            --entry-id artifact-daily-indicators \
            --run-id "${{ github.run_id }}" \
            --run-date "$RUN_DATE" \
            --local-path "data/indicators/daily/indicators_${RUN_DATE_COMPACT}.csv" \
            --json-output /tmp/r2_handoff/enrich/artifact-daily-indicators.json

      - name: Set local CSV path
        id: set_csv
        run: |
          RUN_DATE="${{ inputs.run_date }}"
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          echo "local_csv=data/indicators/daily/indicators_${RUN_DATE_COMPACT}.csv" >> "$GITHUB_OUTPUT"
          if [ ! -f "data/indicators/daily/indicators_${RUN_DATE_COMPACT}.csv" ]; then
            echo "エラー: 指標CSVが見つかりません"
            exit 1
          fi

      - name: Fetch external events for selected codes
        env:
          PYTHONPATH: src
          RUN_DATE: ${{ inputs.run_date }}
          INPUT_CSV: ${{ steps.set_csv.outputs.local_csv }}
        run: |
          python -m stockradar.jobs.fetch_external_events_for_spikes \
            --run-date "$RUN_DATE" \
            --indicators "$INPUT_CSV" \
            --selection-config config/event_cause_daily.yaml \
            --lookback-days 20 \
            --cutoff-time 15:30 \
            --exclude-kabutan-categories "特集,注目" \
            --output "data/external/events/news_tdnet_events_${RUN_DATE//-/}.jsonl"

      - name: Rank event causes
        env:
          PYTHONPATH: src
          RUN_DATE: ${{ inputs.run_date }}
          INPUT_CSV: ${{ steps.set_csv.outputs.local_csv }}
        run: |
          python -m stockradar.jobs.rank_turnover_event_causes \
            --run-date "$RUN_DATE" \
            --indicators "$INPUT_CSV" \
            --events-jsonl "data/external/events/news_tdnet_events_${RUN_DATE//-/}.jsonl" \
            --selection-config config/event_cause_daily.yaml \
            --name-alias-config config/kabutan_name_aliases.yaml

      - name: Build enriched indicators CSV
        id: build_enriched
        env:
          PYTHONPATH: src
          RUN_DATE: ${{ inputs.run_date }}
          INPUT_CSV: ${{ steps.set_csv.outputs.local_csv }}
        run: |
          python -m stockradar.jobs.build_daily_event_cause_enriched_csv \
            --run-date "$RUN_DATE" \
            --indicators "$INPUT_CSV" \
            --summary-csv "data/analysis/event_causes_poc/event_cause_summary_${RUN_DATE//-/}.csv" \
            --candidates-csv "data/analysis/event_causes_poc/event_cause_candidates_${RUN_DATE//-/}.csv" \
            --selection-config config/event_cause_daily.yaml \
            --output "data/indicators/daily/indicators_event_enriched_${RUN_DATE//-/}.csv"
          echo "enriched_csv_path=data/indicators/daily/indicators_event_enriched_${RUN_DATE//-/}.csv" >> "$GITHUB_OUTPUT"

      - name: Upload enriched CSV artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: enriched-csv-${{ inputs.run_date }}
          path: data/indicators/daily/indicators_event_enriched_*.csv
          retention-days: 7
          if-no-files-found: error

      - name: R2 put enriched CSV staging
        id: r2_put_enriched
        if: success()
        continue-on-error: true
        env:
          PYTHONPATH: src:.
          RUN_DATE: ${{ inputs.run_date }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE_PREFIX: ${{ secrets.R2_BASE_PREFIX }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          RUN_DATE_COMPACT="${RUN_DATE//-/}"
          ENRICHED_PATH="data/indicators/daily/indicators_event_enriched_${RUN_DATE_COMPACT}.csv"
          mkdir -p /tmp/r2_producer/enrich
          JSON_OUT="/tmp/r2_producer/enrich/artifact-enriched-csv.json"
          set +e
          python scripts/storage/artifact_bus_cli.py put \
            --entry-id artifact-enriched-csv \
            --run-id "$GITHUB_RUN_ID" \
            --run-date "$RUN_DATE" \
            --source-name "enriched-csv-$RUN_DATE" \
            --local-path "$ENRICHED_PATH" \
            --json-output "$JSON_OUT"
          RC=$?
          set -e
          if [ ! -f "$JSON_OUT" ]; then
            python -c "import json; from pathlib import Path; Path('$JSON_OUT').write_text(json.dumps({'status':'r2_error','entry_id':'artifact-enriched-csv','r2_put_ok':False,'github_upload_ok':None,'degraded_reason':'r2_put_failed','reason':f'put exited rc {RC}'})+'\n', encoding='utf-8')"
          fi
          python -c "import json; from pathlib import Path; p=Path('$JSON_OUT'); d=json.loads(p.read_text(encoding='utf-8')); d['github_upload_ok']=True; p.write_text(json.dumps(d)+'\n', encoding='utf-8')"
          STATUS=$(python -c "import json; print(json.load(open('$JSON_OUT')).get('status',''))")
          if [ "$STATUS" = "ok" ]; then
            MANIFEST_KEY=$(python -c "import json; print(json.load(open('$JSON_OUT'))['manifest_logical_key'])")
            echo "manifest_logical_key=$MANIFEST_KEY" >> "$GITHUB_OUTPUT"
          fi

      - name: Write enrich producer handoff summary
        if: always()
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m stockradar.storage.handoff_summary \
            --mode producer \
            --handoff-dir /tmp/r2_producer/enrich \
            --title "enrich producer handoff" \
            --required artifact-enriched-csv \
            --github-upload-ok artifact-enriched-csv \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Write enrich consumer handoff summary
        if: always()
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          {
            python -m stockradar.storage.handoff_summary \
              --handoff-dir /tmp/r2_handoff/enrich \
              --title "enrich consumer handoff" \
              --required artifact-daily-indicators
          } >> "$GITHUB_STEP_SUMMARY"
