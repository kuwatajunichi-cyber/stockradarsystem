# 日次レポート スプレッドシート生成用設定（XLSX / openpyxl ベース）
# workflow inputs で上書き可能な項目は inputs を優先

# テンプレート（ローカル XLSX ファイル、repo ルートからの相対パス）
template_path: "config/templates/indicators_template_v1.1.xlsx"

# （非推奨）特定のシートに限定したい場合のみ CLI の --header-anchor-sheet-name を使用してください。

# デフォルトソート（出力順）
# sort_column: ソートキー列名（CSVヘッダー名）。未設定時はソートなし
# sort_ascending: true=昇順, false=降順
sort_column: "z_turnover_60"
sort_ascending: false

# CSV Drive ファイルID（workflow inputs で必須指定。ここはデフォルト未設定）
# csv_drive_file_id: null

# シート保護（設定で切り替え）
# sheet_protection: true=全シートに保護をかける, false=保護しない
# sheet_protection_password: 空=パスワードなし, 非空=保護解除時にパスワード必要
sheet_protection: true
sheet_protection_password: "Powerhorn03"

# URL列の表示名マップ（列名 → 表示ラベル）
# 列名はテンプレヘッダー名（CSVヘッダー名）と完全一致
link_label_map:
  link_kabutan: "概要"
  link_kabutan_chart: "チャート"
  link_kabutan_news: "ニュース"
  link_buffett: "Bcode"
  # 将来拡張例:
  # link_minkabu: "みんかぶ"
  # link_yahoo: "Yahoo"

# 表示列 -> URL列 マップ（表示文字列をリンク化）
# 例: event_news_1_title に event_news_1_url を埋め込む
hyperlink_source_map:
  event_news_1_title: "event_news_1_url"
  event_news_2_title: "event_news_2_url"
  event_news_3_title: "event_news_3_url"
