    keep_days: 2
    enabled: true
    max_delete: 200
  - prefix: daily-core-quality-
    keep_days: 2
    enabled: true
    max_delete: 200
  - prefix: daily-index-store-
    keep_days: 2
    enabled: true
    max_delete: 200
  - prefix: daily-ohlc-store-
    keep_days: 2
    enabled: true
    max_delete: 200
