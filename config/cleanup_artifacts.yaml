# GitHub Actions artifact cleanup rules (used by scripts/cleanup_artifacts.py)
# Phase 2: daily run-internal bus moved to R2 runs/ staging; legacy prefixes disabled.
rules:
  - prefix: daily-core-csv-
    keep_days: 2
    enabled: false
    max_delete: 200
  - prefix: daily-core-quality-
    keep_days: 2
    enabled: false
    max_delete: 200
  - prefix: daily-index-store-
    keep_days: 2
    enabled: false
    max_delete: 200
  - prefix: daily-ohlc-store-
    keep_days: 2
    enabled: false
    max_delete: 200
