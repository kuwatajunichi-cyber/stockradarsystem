[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stockradar"
version = "0.1.0"
description = "Stock Radar System - data pipeline for Japanese equity market analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "xlrd>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "yfinance>=0.2.0",
    "exchange-calendars>=4.3.0",
    "pytz>=2023.3",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "unit: fast pure/unit tests",
    "job_integration: integration tests for batch jobs",
    "smoke: CLI and contract smoke tests",
    "live_dispatch: manual live API smoke (not CI required)",
    "slow: long-running tests excluded from default local runs",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F401", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
disable_error_code = ["import-untyped"]
