    proposed: {table: 126日RS, chart_legend: 126日RS, chart_hover: 126日RS}
    explanation: 126営業日（約半年）のリターンの指数比。
    spec_notes:
      - 表の「126日」、凡例の「RS126」、XLSX の「126日」と同じ値。
  - id: rs252
    group: metric
    surface: table_column_and_chart
    family: index_relative
    formal_name: 252日 指数比リターン
    internal_name: rs252（RS252、相対力 B方式）。rs252_topix / rs252_nikkei
    field_keys: [rs252_topix, rs252_nikkei]
    chart_series_id: rs252
    on_chart: true
    default_visible: true
    current: {table: 252日, chart_legend: RS252, chart_hover: RS252}
    proposed: {table: 252日RS, chart_legend: 252日RS, chart_hover: 252日RS}
    explanation: 252営業日（約1年）のリターンの指数比。「指数比の加速」は、指数比 31日リターンからこの値を引いた差。
    spec_notes:
      - 表の「252日」、凡例の「RS252」、XLSX の「252日」と同じ値。
  - id: rs_sma75
    group: metric
    surface: table_column_and_chart
