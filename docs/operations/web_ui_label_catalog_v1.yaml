      前営業日の終値に対する基準日終値の変化率。+3.0 なら前営業日より 3% 高い。
      この列だけ値が%で、指数比の小数（0.1＝10%分）とは単位が違う。指数との比較は含まない。
    spec_notes:
      - 表示は小数1桁。
      - 既定では隠れている列。列パネルで追加すると同じツールチップを出す。
