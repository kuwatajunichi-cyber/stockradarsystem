    proposed: {table: ﾊﾟｰﾌｪｸﾄｵｰﾀﾞｰ日数, chart_legend: null, chart_hover: null}
    explanation: >
      終値の25日・75日・200日移動平均線が、短い線ほど上に並んだ状態（25日線 > 75日線 > 200日線）が、基準日まで何営業日続いているか。
      上昇の並びだけ数え、逆の並び（下降パーフェクトオーダー）は数えない。0 はその並びではない。
      220営業日分（1年弱）の株価がない銘柄は空欄。
    spec_notes:
      - 既定では隠れている列。列パネルで追加すると同じツールチップを出す。
  - id: price_change_pct
    group: optional_metric
    surface: table_column_optional
    formal_name: 前日比(%)（前営業日終値に対する基準日終値の変化率）
