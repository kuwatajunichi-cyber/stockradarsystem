  - id: beta_adjusted_rs
    group: optional_metric
    surface: table_column_optional
    formal_name: 連動分を除く指数比 252日リターン（1年のリターン − β×指数のリターン）
    internal_name: beta_adjusted_rs（β調整RS、累積窓252、β推定窓126）。beta_adjusted_rs_topix / _nikkei
    field_keys: [beta_adjusted_rs_topix, beta_adjusted_rs_nikkei]
    on_chart: false
    default_visible: false
    current: {table: β調整RS, chart_legend: null, chart_hover: null}
    proposed: {table: 除β 252日RS, chart_legend: null, chart_hover: null}
    explanation: >
      1年（252営業日）のリターンから、「この銘柄が指数にどれだけ連動して動くか」（β、ベータ）×「指数のリターン」を引いた値。
      βが1.5なら、指数が1%動くとこの銘柄は平均1.5%動くという意味。
      指数比 252日リターンは連動の強さを1とみなして引くのに対し、こちらは銘柄ごとの連動の強さを考慮する。
      正なら、指数に連動して動いた分を除いても上がっている。
    spec_notes:
      - βは、リターン期間（252営業日）の直前126営業日の日次リターンで推定する。
      - 既定では隠れている列。列パネルで追加すると同じツールチップを出す。
  - id: information_ratio
    group: optional_metric
    surface: table_column_optional
    formal_name: 指数比の安定度（63営業日。日々のリターンの差の平均 ÷ ばらつき）
    internal_name: information_ratio（情報比率、窓63）。information_ratio_topix / _nikkei
    field_keys: [information_ratio_topix, information_ratio_nikkei]
    on_chart: false
    default_visible: false
    current: {table: 情報比率, chart_legend: null, chart_hover: null}
    proposed: {table: RSの安定度, chart_legend: null, chart_hover: null}
    explanation: >
      直近63営業日（約3か月）について、毎日の「この銘柄の前日比 − 比較指数の前日比」の平均を、そのばらつき（標準偏差）で割った値。
      指数を上回る日が安定して続くほど正に大きく、下回る日が続くほど負に大きい。
      日によってまちまちだと、平均が同じでも絶対値は小さくなる。
      %でも倍率でもなく、指数比 63日リターンとは別の量。専門用語では情報比率。
    spec_notes:
      - 既定では隠れている列。列パネルで追加すると同じツールチップを出す。
  - id: perfect_order_days
    group: optional_metric
    surface: table_column_optional
    formal_name: パーフェクトオーダー（25日線 > 75日線 > 200日線）の継続日数
    internal_name: perfect_order_days（SMA25>SMA75>SMA200、最小履歴220営業日）
    field_keys: [perfect_order_days]
    on_chart: false
    default_visible: false
