    formal_name: 75日移動平均線 指数比傾き
    internal_name: rs_sma75（SMA75系列の31日 B方式 RS。終値の RS75 ではない）。rs_sma75_topix / rs_sma75_nikkei
    field_keys: [rs_sma75_topix, rs_sma75_nikkei]
    chart_series_id: rs_sma75
    on_chart: true
    default_visible: true
    current: {table: SMA75 RS, chart_legend: SMA75RS, chart_hover: SMA75RS}
    proposed: {table: 75移動平均RS, chart_legend: 75移動平均RS, chart_hover: 75移動平均RS}
    explanation: >
      この銘柄と比較指数それぞれの「75日線」（直近75営業日の終値の平均をつないだ線）が、31営業日でどれだけ上がったかの割合の差。
      終値の代わりに、日々の上下をならした線で比べるので、流れとしてどちらが強いかが出る。
      単位は指数比 31日リターンと同じで、1日あたりの傾きではない。指数比を75日で平均した線でも、75日リターンでもない。
    spec_notes:
      - 計算は 75日単純移動平均の系列に 31営業日の B方式 RS を当てる（平均が先、比較が後）。
      - グラフの軸は指数比 31日リターンと共有する。グラフに描いた線の傾きのことではない。
      - 表の「SMA75 RS」、凡例の「SMA75RS」と同じ値。XLSX には列がない。
