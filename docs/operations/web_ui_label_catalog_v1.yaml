    proposed: {table: 63日RS, chart_legend: 63日RS, chart_hover: 63日RS}
    explanation: 63営業日（約3か月）のリターンの指数比。
    spec_notes:
      - 表の「63日」、凡例の「RS63」、XLSX の「63日」と同じ値。
  - id: rs126
    group: metric
    surface: table_column_and_chart
