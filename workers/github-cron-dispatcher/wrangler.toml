# Cloudflare Cron -> GitHub Actions workflow_dispatch
# Phase 1: daily.yml (45 6 * * * UTC)
# Patch cutover: daily_universe_patch.yml (0 3 * * * UTC)
# Phase 4c: monthly.yml (0 2 1 * * UTC)
name = "github-cron-dispatcher"
main = "src/index.js"
compatibility_date = "2024-06-01"
workers_dev = false

# Persist invocation + console logs so silent Cron misses are distinguishable
# from dispatch failures (8/26 incident: observability was null).
[observability]
enabled = true

[observability.logs]
invocation_logs = true
head_sampling_rate = 1

[triggers]
# MNC poller: day-1 UTC 02:00–05:45 only (after Monthly 11:00 JST; ~16 ticks/month max).
crons = ["45 6 * * *", "0 3 * * *", "0 2 1 * *", "*/15 2-5 1 * *"]

# Non-secret config (override per environment via wrangler deploy / dashboard)
[vars]
GITHUB_OWNER = "kuwatajunichi-cyber"
GITHUB_REPO = "stockradarsystem"
GITHUB_REF = "main"
MONTHLY_DISPATCH_ENABLED = "true"
MNC_DISPATCH_ENABLED = "true"

# Secret (set via: wrangler secret put GH_DISPATCH_TOKEN)
# GH_DISPATCH_TOKEN = fine-grained PAT or GitHub App token with workflow dispatch permission
