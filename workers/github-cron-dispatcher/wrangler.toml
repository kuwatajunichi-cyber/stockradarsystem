# Cloudflare Cron -> GitHub Actions workflow_dispatch (Phase 1: daily.yml only)
name = "github-cron-dispatcher"
main = "src/index.js"
compatibility_date = "2024-06-01"
workers_dev = false

[triggers]
crons = ["37 6 * * MON-FRI"]

# Non-secret config (override per environment via wrangler deploy / dashboard)
[vars]
GITHUB_OWNER = "kuwatajunichi-cyber"
GITHUB_REPO = "stockradarsystem"
GITHUB_REF = "main"

# Secret (set via: wrangler secret put GH_DISPATCH_TOKEN)
# GH_DISPATCH_TOKEN = fine-grained PAT or GitHub App token with workflow dispatch permission
